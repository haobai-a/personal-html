<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>帝尊世界 · 本地单机版</title>
<style>
/* ============ 基础 ============ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070b11; --bg2:#0d141d; --panel:rgba(15,23,33,.92); --panel2:rgba(10,16,23,.92);
  --line:rgba(216,180,106,.16); --line2:rgba(216,180,106,.32);
  --gold:#d8b46a; --gold2:#f3dfae; --ink:#e9e3d6; --dim:#8b98a8; --dim2:#5f6f80;
  --jade:#6fd7b0; --red:#e2706b; --blue:#7fb2e6; --violet:#b492e6;
  --hp:#e0555a; --xp:#61c8e0;
  --r:14px;
}
html,body{height:100%}
body{
  background:
    radial-gradient(900px 500px at 12% -10%, rgba(96,130,190,.16), transparent 60%),
    radial-gradient(700px 420px at 92% 0%, rgba(180,140,90,.10), transparent 60%),
    radial-gradient(900px 600px at 50% 120%, rgba(60,110,120,.12), transparent 65%),
    linear-gradient(180deg,#080c12,#05080c 60%,#070b10);
  color:var(--ink);
  font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  font-size:15px; line-height:1.55;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{ /* 星尘 */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:
    radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.55), transparent),
    radial-gradient(1px 1px at 70% 15%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 45% 70%, rgba(255,240,200,.45), transparent),
    radial-gradient(1px 1px at 85% 60%, rgba(255,255,255,.35), transparent),
    radial-gradient(1px 1px at 12% 80%, rgba(200,230,255,.45), transparent),
    radial-gradient(2px 2px at 60% 88%, rgba(255,255,255,.22), transparent);
  background-size:100% 100%;
}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:1400px;margin:0 auto;padding:10px 14px 14px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(216,180,106,.22);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(216,180,106,.4)}
::-webkit-scrollbar-track{background:transparent}

/* ============ 顶栏 ============ */
.hud{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 6px 12px;flex:0 0 auto}
.brand{display:flex;align-items:baseline;gap:10px;letter-spacing:.12em}
.brand .glyph{color:var(--gold);font-size:22px;filter:drop-shadow(0 0 10px rgba(216,180,106,.5))}
.brand b{font-size:21px;font-weight:600;background:linear-gradient(180deg,#f7e9c8,#c79f56);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{color:var(--dim2);font-size:11px;letter-spacing:.2em}
.hud-actions{display:flex;gap:8px}

/* ============ 布局 ============ */
.layout{flex:1 1 auto;display:grid;grid-template-columns:272px minmax(0,1fr) 324px;gap:14px;min-height:0}
.side{min-height:0;overflow:auto;padding-right:2px;display:flex;flex-direction:column;gap:12px}
.main{min-height:0;display:flex;flex-direction:column;gap:10px}

/* ============ 卡片 ============ */
.card{
  background:linear-gradient(180deg,rgba(18,27,38,.92),rgba(9,14,20,.94));
  border:1px solid var(--line);border-radius:var(--r);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04), inset 0 0 40px rgba(0,0,0,.35), 0 12px 30px rgba(0,0,0,.35);
  padding:14px;position:relative;
}
.card::after{content:"";position:absolute;inset:0;border-radius:var(--r);pointer-events:none;
  background:radial-gradient(120% 60% at 50% -10%,rgba(216,180,106,.07),transparent 60%)}
.card h3{font-size:14px;letter-spacing:.18em;color:var(--gold);font-weight:500;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.card h3 em{font-style:normal;color:var(--dim2);font-size:11px;letter-spacing:.08em}

/* 角色卡 */
.who{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.avatar{width:54px;height:54px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:24px;
  background:radial-gradient(circle at 35% 30%,#25405a,#0c1620 70%);border:1px solid var(--line2);
  box-shadow:0 0 22px rgba(120,180,220,.15), inset 0 0 18px rgba(0,0,0,.6);color:var(--gold2)}
.who .nm{font-size:17px;letter-spacing:.06em}
.who .rl{font-size:12px;color:var(--dim);letter-spacing:.08em}
.who .rl b{color:var(--jade);font-weight:500}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;border:1px solid var(--line2);color:var(--gold2);letter-spacing:.05em;line-height:1.5}
.tag.dim{border-color:rgba(255,255,255,.1);color:var(--dim)}
.tag.jade{border-color:rgba(111,215,176,.35);color:var(--jade)}
.tag.red{border-color:rgba(226,112,107,.4);color:var(--red)}

/* 进度条 */
.bar{height:9px;border-radius:99px;background:rgba(255,255,255,.05);overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.04)}
.bar i{display:block;height:100%;border-radius:99px;transition:width .35s ease;position:relative}
.bar.hp i{background:linear-gradient(90deg,#8e2d33,#e0555a 60%,#ff8b83);box-shadow:0 0 12px rgba(224,85,90,.5)}
.bar.xp i{background:linear-gradient(90deg,#2a6c85,#61c8e0 60%,#a7f0ff);box-shadow:0 0 12px rgba(97,200,224,.45)}
.bar.sm{height:6px}
.barrow{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin:7px 0 4px;letter-spacing:.05em}
.barrow b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}

/* 属性 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.kv{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);gap:8px}
.kv b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.kv b.gold{color:var(--gold2)}
.kv b.jade{color:var(--jade)}
.kv b.red{color:var(--red)}

.equips{display:flex;flex-direction:column;gap:5px;margin-top:2px}
.equip{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.04);color:var(--dim)}
.equip b{color:var(--gold2);font-weight:500}
.equip.empty b{color:var(--dim2);font-weight:400}

/* 按钮 */
.btn{
  appearance:none;cursor:pointer;border-radius:10px;padding:9px 16px;font:inherit;font-size:13.5px;
  color:var(--ink);background:linear-gradient(180deg,rgba(40,55,72,.85),rgba(20,29,40,.9));
  border:1px solid var(--line2);letter-spacing:.08em;transition:.18s;position:relative;
}
.btn:hover:not(:disabled){border-color:var(--gold);color:#fff;box-shadow:0 0 0 1px rgba(216,180,106,.2),0 0 18px rgba(216,180,106,.16);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,#e8cd8e,#b9924e);color:#1b1305;border-color:#f0d9a2;font-weight:600}
.btn.primary:hover:not(:disabled){box-shadow:0 0 22px rgba(216,180,106,.45);color:#000}
.btn.jade{background:linear-gradient(180deg,rgba(50,120,100,.55),rgba(18,54,46,.85));border-color:rgba(111,215,176,.45)}
.btn.jade:hover:not(:disabled){border-color:var(--jade);box-shadow:0 0 18px rgba(111,215,176,.25)}
.btn.blood{background:linear-gradient(180deg,rgba(130,45,48,.6),rgba(50,16,18,.9));border-color:rgba(226,112,107,.45)}
.btn.blood:hover:not(:disabled){border-color:var(--red);box-shadow:0 0 18px rgba(226,112,107,.25)}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.09);color:var(--dim)}
.btn.ghost:hover:not(:disabled){color:var(--ink);border-color:var(--line2)}
.btn.tiny{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.wide{width:100%}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.btn-row.center{justify-content:center}

/* 导航 */
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:5px;border-radius:14px;background:rgba(8,13,19,.7);border:1px solid rgba(255,255,255,.04);flex:0 0 auto}
.tab{cursor:pointer;padding:6px 9px;border-radius:8px;font-size:12.5px;color:var(--dim);letter-spacing:.04em;border:1px solid transparent;transition:.16s;background:none;font-family:inherit}
.tab:hover{color:var(--ink);background:rgba(255,255,255,.04)}
.tab.on{color:#1b1305;background:linear-gradient(180deg,#eed79b,#c4a05b);border-color:#f2e0b6;font-weight:600;box-shadow:0 0 18px rgba(216,180,106,.28)}
.tab .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--jade);margin-left:5px;vertical-align:middle;box-shadow:0 0 8px var(--jade)}

/* 滚动区 */
.scroll{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px}
.view{flex:1 1 auto;min-height:0;overflow:auto;padding-right:4px}
#viewInner{display:flex;flex-direction:column;gap:12px;padding-bottom:6px}

/* 日志栏：常驻右侧 */
.lograil{display:flex;flex-direction:column;min-height:0;border-radius:var(--r);overflow:hidden;
  background:linear-gradient(180deg,rgba(11,17,25,.97),rgba(5,8,12,.99));
  border:1px solid rgba(255,255,255,.06);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03), inset 0 0 40px rgba(0,0,0,.4), 0 12px 30px rgba(0,0,0,.35)}
.loghead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;font-size:11px;letter-spacing:.24em;color:var(--dim2);
  border-bottom:1px solid rgba(255,255,255,.05);background:rgba(255,255,255,.015);flex:0 0 auto}
.loghead .lhtitle{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.loghead .live{width:6px;height:6px;border-radius:50%;background:var(--jade);box-shadow:0 0 8px var(--jade);animation:livePulse 2.6s ease-in-out infinite}
@keyframes livePulse{0%,100%{opacity:.45;transform:scale(.85)}50%{opacity:1;transform:scale(1.05)}}
.loghead .lhact{display:flex;align-items:center;gap:6px}
.loglatest{display:none;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:11.5px;letter-spacing:.02em;color:var(--dim);padding:0 8px}
#logToggle{display:none;cursor:pointer;font-size:11px;letter-spacing:.08em;color:var(--gold);
  border:1px solid var(--line2);padding:1px 9px;border-radius:99px;user-select:none}
.log{flex:1 1 auto;min-height:0;overflow:auto;padding:9px 12px;font-size:12.6px;line-height:1.7;font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
.log .l{padding:1px 0 1px 9px;border-left:2px solid rgba(255,255,255,.06);margin-bottom:1px;color:#b9c2cc;white-space:pre-wrap;word-break:break-word}
.log .l.good{border-color:rgba(111,215,176,.55);color:#a8e6cd}
.log .l.bad{border-color:rgba(226,112,107,.6);color:#f0a39f}
.log .l.gold{border-color:rgba(216,180,106,.65);color:#f0d79a}
.log .l.sys{border-color:rgba(127,178,230,.5);color:#9dc3ea}
.log .l.big{font-size:13.4px;font-weight:600}
.log .l .t{color:var(--dim2);font-size:10.5px;margin-right:6px;letter-spacing:.04em}
.log .empty{color:var(--dim2);font-size:12px;letter-spacing:.1em}

/* 通用小件 */
.section-title{display:flex;align-items:center;gap:10px;margin:2px 0 0}
.section-title .ln{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.section-title span{font-size:12px;letter-spacing:.3em;color:var(--gold)}
.hint{font-size:12px;color:var(--dim2);line-height:1.7}
.hint b{color:var(--dim);font-weight:500}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);margin:12px 0}
.muted{color:var(--dim)}
.gold{color:var(--gold2)}
.jade{color:var(--jade)}
.red{color:var(--red)}
.blue{color:var(--blue)}
.violet{color:var(--violet)}
.num{font-variant-numeric:tabular-nums}

/* 创建 / 弹窗 */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(3,6,10,.78);backdrop-filter:blur(4px);padding:20px}
.modal.hidden{display:none}
.modal-box{width:min(560px,100%);max-height:86vh;overflow:auto}
.confirm-body{font-size:13.5px;color:var(--dim)}
.confirm-body b{color:var(--ink)}
.create{display:flex;flex-direction:column;gap:14px}
input[type=text],input[type=number],input[type=password],select,textarea{
  width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:9px;color:var(--ink);
  padding:10px 12px;font:inherit;font-size:14px;outline:none;letter-spacing:.06em
}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 1px rgba(216,180,106,.25)}
input[type=number]{width:78px;padding:7px 8px;text-align:center;font-variant-numeric:tabular-nums}
label.fl,.fl{font-size:12px;letter-spacing:.18em;color:var(--dim)}

/* 冒险地图卡 */
.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.map{position:relative;cursor:pointer;text-align:left;padding:13px 14px;border-radius:12px;font-family:inherit;
  background:linear-gradient(160deg,rgba(24,36,50,.9),rgba(9,14,20,.95));border:1px solid rgba(255,255,255,.06);
  color:var(--ink);transition:.2s;overflow:hidden}
.map:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.45),0 0 24px rgba(216,180,106,.08)}
.map .mt{font-size:15px;letter-spacing:.1em;margin-bottom:2px}
.map .md{font-size:11.5px;color:var(--dim2);letter-spacing:.04em}
.map .mr{font-size:11.5px;color:var(--jade);margin-top:7px}
.map .lock{position:absolute;top:10px;right:11px;font-size:10.5px;color:var(--dim2);border:1px solid rgba(255,255,255,.1);padding:1px 6px;border-radius:99px}
.map::before{content:"";position:absolute;right:-30px;bottom:-40px;width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle,rgba(216,180,106,.12),transparent 70%)}

/* 战斗 */
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.fighter{padding:12px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.05);text-align:center}
.fighter .fn{font-size:14px;letter-spacing:.1em;margin-bottom:8px}
.fighter .fh{font-size:11.5px;color:var(--dim);margin-top:6px}
.vs{color:var(--gold);font-size:16px;letter-spacing:.1em;opacity:.7}
.enemy-card{position:relative;overflow:hidden;padding:16px;border-radius:12px;background:
  radial-gradient(120% 100% at 50% 0%,rgba(140,40,45,.16),transparent 70%),rgba(0,0,0,.3);
  border:1px solid rgba(226,112,107,.2);transition:border-color .25s}
.enemy-card .en{font-size:19px;letter-spacing:.12em;margin-bottom:8px;color:#ffd7d3}
.enemy-card .ed{font-size:12.5px;color:var(--dim)}
.enemy-card.elite{border-color:rgba(180,146,230,.35);background:radial-gradient(120% 100% at 50% 0%,rgba(120,80,190,.18),transparent 70%),rgba(0,0,0,.3)}
.enemy-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.enemy-head .en{margin-bottom:0}
.traits{display:flex;gap:5px;flex-wrap:wrap}
.trait{font-size:10.5px;letter-spacing:.06em;color:#d9c9a6;border:1px solid rgba(216,180,106,.28);
  background:rgba(216,180,106,.07);padding:1px 7px;border-radius:99px;cursor:help}
.trait.danger{color:#f0a39f;border-color:rgba(226,112,107,.4);background:rgba(226,112,107,.08)}
.player-strip{position:relative;padding:12px 14px;border-radius:12px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.05)}
.status-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;min-height:18px}
.status{font-size:10.5px;padding:1px 7px;border-radius:99px;border:1px solid rgba(255,255,255,.12);color:var(--dim)}
.status.poison{color:#b9e08a;border-color:rgba(150,200,90,.4);background:rgba(120,170,60,.08)}
.status.slow{color:#a7d4f0;border-color:rgba(120,180,220,.4);background:rgba(80,140,190,.08)}
.status.rage{color:#ffbe8a;border-color:rgba(226,140,90,.45);background:rgba(200,110,60,.1)}
.status.demon{color:#f0a39f;border-color:rgba(226,112,107,.45);background:rgba(200,60,60,.1)}
.fx-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dmg-pop{position:absolute;left:50%;top:38%;transform:translate(-50%,0);font-family:"Noto Sans SC",system-ui,sans-serif;
  font-size:26px;font-weight:700;letter-spacing:.02em;color:#ffb3ad;text-shadow:0 2px 12px rgba(0,0,0,.8),0 0 18px rgba(226,112,107,.5);
  animation:floatUp .95s cubic-bezier(.2,.7,.3,1) forwards;white-space:nowrap}
.dmg-pop.crit{font-size:34px;color:#ffd97a;text-shadow:0 2px 14px rgba(0,0,0,.85),0 0 24px rgba(255,190,90,.7)}
.dmg-pop.heal{color:#a8e6cd;text-shadow:0 2px 12px rgba(0,0,0,.8),0 0 18px rgba(111,215,176,.55)}
.dmg-pop.miss{font-size:20px;color:#cfd8e3;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.slash{position:absolute;left:-20%;top:50%;width:140%;height:3px;border-radius:3px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),rgba(255,220,150,.95),transparent);
  box-shadow:0 0 18px rgba(255,220,150,.8);animation:slashIn .42s ease-out forwards;transform-origin:center}
.enemy-card.hit{animation:cardHit .38s ease}
.enemy-card.hit{box-shadow:0 0 30px rgba(226,112,107,.22), inset 0 0 34px rgba(226,112,107,.12)}
.enemy-card.crit{animation:cardCrit .46s ease;box-shadow:0 0 40px rgba(255,190,90,.3), inset 0 0 40px rgba(255,190,90,.14)}
.enemy-card.dead{animation:death .6s ease forwards}
.player-strip.hurt{animation:cardHit .34s ease;box-shadow:0 0 26px rgba(226,112,107,.22), inset 0 0 26px rgba(226,112,107,.12)}
.enemy-card.flash-heal{box-shadow:inset 0 0 40px rgba(111,215,176,.18)}
.battle-card{animation:viewIn .32s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(8px) scale(.995)}to{opacity:1;transform:none}}
@keyframes cardHit{0%{transform:translateX(0)}15%{transform:translateX(-6px)}30%{transform:translateX(5px)}45%{transform:translateX(-3px)}60%{transform:translateX(2px)}100%{transform:translateX(0)}}
@keyframes cardCrit{0%{transform:scale(1)}12%{transform:scale(1.035) translateX(-8px) rotate(-.4deg)}28%{transform:translateX(7px) rotate(.4deg)}45%{transform:translateX(-4px)}100%{transform:none}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,14px) scale(.75)}18%{opacity:1;transform:translate(-50%,-2px) scale(1.12)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-58px) scale(1)}}
@keyframes slashIn{0%{opacity:0;transform:translateX(-130%) rotate(-17deg)}30%{opacity:1}100%{opacity:0;transform:translateX(130%) rotate(-17deg)}}
@keyframes death{0%{opacity:1;transform:scale(1);filter:none}100%{opacity:.22;transform:scale(.965);filter:grayscale(1) blur(1px)}}
@media (prefers-reduced-motion: reduce){
  .enemy-card.hit,.enemy-card.crit,.player-strip.hurt,.battle-card,.dmg-pop,.slash{animation:none!important}
}

/* 背包 */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.slot{position:relative;padding:9px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.06);
  background:linear-gradient(180deg,rgba(30,42,56,.55),rgba(10,16,23,.8));cursor:pointer;transition:.15s;text-align:left;font-family:inherit;color:var(--ink)}
.slot:hover{border-color:var(--line2);box-shadow:0 0 16px rgba(216,180,106,.12)}
.slot .sn{font-size:13px;letter-spacing:.04em}
.slot .ss{font-size:11px;color:var(--dim2);margin-top:2px}
.slot.empty{opacity:.45;cursor:default;background:rgba(255,255,255,.015);border-style:dashed}
.slot.empty:hover{border-color:rgba(255,255,255,.06);box-shadow:none}
.slot.on{border-color:var(--gold);box-shadow:0 0 0 1px rgba(216,180,106,.25),0 0 20px rgba(216,180,106,.12)}
.slot.off{opacity:.22;filter:grayscale(.7)}
.diff{font-size:11px;margin-left:6px;font-style:normal;font-weight:400}
.diff.up{color:var(--jade)}
.diff.down{color:var(--red)}
.diff.flat{color:var(--dim2)}

/* 列表/商店 */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.022);border:1px solid rgba(255,255,255,.045)}
.row .rt{flex:1;min-width:0}
.row .rt .rn{font-size:13.6px;letter-spacing:.04em;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .rt .rd{font-size:11.5px;color:var(--dim2);margin-top:2px}
.row .rp{font-size:12.5px;color:var(--gold2);white-space:nowrap;font-variant-numeric:tabular-nums}
.buyrow{display:flex;align-items:center;gap:8px}
.buyrow select{width:auto;flex:1;min-width:120px;padding:8px 10px}
.qty{width:62px!important;padding:6px 4px!important;font-size:12.5px!important}

/* 境界轨道 */
.track{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px}
.rl{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:8px;font-size:12.6px;color:var(--dim);border:1px solid transparent}
.rl .ln{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.12);flex:0 0 auto}
.rl.done{color:#9dc3ea}
.rl.done .ln{background:rgba(127,178,230,.55);box-shadow:0 0 8px rgba(127,178,230,.4)}
.rl.now{color:var(--gold2);background:rgba(216,180,106,.07);border-color:rgba(216,180,106,.2)}
.rl.now .ln{background:var(--gold);box-shadow:0 0 12px rgba(216,180,106,.8)}
.rl .rq{margin-left:auto;font-size:11.5px;color:var(--dim2);font-variant-numeric:tabular-nums}
.rl.done .rq{color:rgba(157,195,234,.6)}

/* 门派成员 */
.members{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.member{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;font-size:12.5px;
  background:rgba(255,255,255,.022);border:1px solid rgba(255,255,255,.045)}
.member .mn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member .mp{font-size:11.5px;color:var(--dim2);font-variant-numeric:tabular-nums}
.member .tag{font-size:10.5px;padding:0 6px}

/* 修改器 */
.admin label.fl{display:block;margin-bottom:4px;font-size:11px}
.admin .grid2{gap:12px 16px}
.admin .grid2 input[type=number]{width:100%;text-align:left;font-size:14px;padding:8px 10px}
.admin .grid2 select{font-size:14px;padding:8px 10px}

/* 统计块 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stat{padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.022);border:1px solid rgba(255,255,255,.045)}
.stat .sl{font-size:11px;color:var(--dim2);letter-spacing:.1em}
.stat .sv{font-size:17px;margin-top:2px;color:var(--gold2);font-variant-numeric:tabular-nums}

/* 战斗内日志 */
.blog{margin-top:14px;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.05);
  font-size:12.4px;line-height:1.75;min-height:92px;max-height:158px;overflow:auto;font-family:"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
.blog div{padding:1px 0;color:#b9c2cc}
.blog div.good{color:#a8e6cd}
.blog div.bad{color:#f0a39f}
.blog div.gold{color:#f0d79a}
.blog div.sys{color:#9dc3ea}
.blog .none{color:var(--dim2);letter-spacing:.1em}

/* toast */
#toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);z-index:99;pointer-events:none;
  display:flex;flex-direction:column;gap:8px;align-items:center}
.tst{display:flex;align-items:center;gap:8px;padding:9px 18px;border-radius:99px;background:rgba(12,18,26,.97);border:1px solid var(--line2);
  color:var(--gold2);font-size:13px;letter-spacing:.06em;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:tin .25s ease, tout .3s ease 2.2s forwards}
.tst .tick{display:grid;place-items:center;width:16px;height:16px;border-radius:50%;font-size:10px;
  background:rgba(111,215,176,.18);color:var(--jade);flex:0 0 auto}
.tst.ok{border-color:rgba(111,215,176,.55);color:#c9f5e4;box-shadow:0 8px 30px rgba(0,0,0,.5),0 0 22px rgba(111,215,176,.14)}
.tst.err{border-color:rgba(226,112,107,.55);color:#ffc9c5;box-shadow:0 8px 30px rgba(0,0,0,.5),0 0 22px rgba(226,112,107,.14)}
.tst.err .tick{background:rgba(226,112,107,.18);color:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}

/* 空状态 */
.empty-state{padding:30px 16px;text-align:center;color:var(--dim2);font-size:13px;letter-spacing:.1em;line-height:2}

/* 响应式 */
@media (max-width:1240px){
  .layout{grid-template-columns:272px minmax(0,1fr)}
  .app{padding-bottom:36vh}
  .lograil{position:fixed;left:0;right:0;bottom:0;height:32vh;z-index:40;border-radius:16px 16px 0 0;
    backdrop-filter:blur(8px);box-shadow:0 -14px 50px rgba(0,0,0,.65);transition:height .25s ease}
  .lograil.collapsed{height:46px}
  .lograil.collapsed .log{display:none}
  .lograil.collapsed .loglatest{display:block}
  .loghead{cursor:pointer}
  #logToggle{display:inline-block}
  #toast{bottom:calc(32vh + 14px)}
}
@media (max-width:960px){
  html,body{overflow-x:hidden}
  body{overflow-y:auto;height:auto}
  .app{height:auto;min-height:100vh;padding:8px 10px 40vh;width:100%;max-width:100%}
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{order:2;min-width:0}
  .main{order:1;min-width:0}
  .view{overflow:visible;padding-bottom:0}
  .lograil{height:34vh}
  #toast{bottom:calc(34vh + 14px)}
  .hud{flex-wrap:wrap;gap:8px}
  .brand small{display:none}
  .brand b{font-size:19px}
  .maps{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(auto-fit,minmax(88px,1fr))}
  .tabs{gap:4px;padding:5px}
  .tab{padding:6px 10px;font-size:12.5px;letter-spacing:.04em}
  .row{flex-wrap:wrap}
  .buyrow{flex-wrap:wrap}
  .arena{grid-template-columns:1fr}
  .vs{display:none}
  .card{padding:12px}
  .slots{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  .blog{max-height:230px}
  .track{grid-template-columns:1fr}
  .members{grid-template-columns:1fr}
  /* iOS 上字号小于 16px 会在聚焦时强制缩放，看起来像键盘弹不出来 */
  input[type=text],input[type=number],input[type=password],textarea,select,.qty{font-size:16px!important}
  .qty{width:72px!important}
  .create .hint{font-size:12.5px}
}
/* ============================================================
   v2 视觉打磨 · 参考 Uiverse 开源元素的常见手法（渐变描边/扫光/
   悬浮/呼吸光/极光背景），全部为本地 CSS，无外部资源
   ============================================================ */

/* 背景极光 */
body::after{
  content:"";position:fixed;inset:-15%;z-index:0;pointer-events:none;
  background:
    radial-gradient(38% 30% at 18% 22%, rgba(86,134,214,.18), transparent 70%),
    radial-gradient(32% 28% at 82% 12%, rgba(206,156,92,.14), transparent 70%),
    radial-gradient(42% 34% at 52% 92%, rgba(64,158,148,.14), transparent 70%);
  filter:blur(38px);opacity:.9;
  animation:auroraDrift 28s ease-in-out infinite alternate;
}
@keyframes auroraDrift{
  0%{transform:translate3d(-2%,-1%,0) scale(1)}
  100%{transform:translate3d(2%,2%,0) scale(1.07)}
}

/* 卡片：悬浮辉光 */
.card{transition:border-color .25s ease, box-shadow .3s ease}
.card:hover{
  border-color:rgba(216,180,106,.26);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), inset 0 0 40px rgba(0,0,0,.35),
    0 16px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(216,180,106,.12);
}

/* 按钮：扫光 + 按压 + 主按钮呼吸 */
.btn{position:relative;overflow:hidden;isolation:isolate;
  transition:transform .16s ease, box-shadow .22s ease, border-color .2s ease, color .2s ease}
.btn::after{
  content:"";position:absolute;top:-10%;left:-140%;width:55%;height:120%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);
  transform:skewX(-16deg);transition:left .55s ease;pointer-events:none;z-index:0;
}
.btn:hover::after{left:150%}
.btn:active{transform:translateY(1px) scale(.99)}
.btn:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.btn.primary{
  box-shadow:0 4px 16px rgba(216,180,106,.2), inset 0 1px 0 rgba(255,255,255,.45);
  animation:primaryBreath 4.4s ease-in-out infinite;
}
@keyframes primaryBreath{
  0%,100%{box-shadow:0 4px 16px rgba(216,180,106,.18), inset 0 1px 0 rgba(255,255,255,.45)}
  50%{box-shadow:0 7px 26px rgba(216,180,106,.34), inset 0 1px 0 rgba(255,255,255,.55)}
}

/* 标签页：下沿流光 */
.tab{position:relative;overflow:hidden;transition:color .18s, background .18s, border-color .18s, transform .18s}
.tab::after{
  content:"";position:absolute;left:50%;right:50%;bottom:3px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--gold2),transparent);
  opacity:0;transition:left .25s ease, right .25s ease, opacity .25s ease;
}
.tab:hover::after{left:30%;right:30%;opacity:.5}
.tab.on::after{left:24%;right:24%;opacity:1;box-shadow:0 0 10px var(--gold)}
.tab.on{transform:translateY(-1px)}

/* 进度条：流光 */
.bar{position:relative;overflow:hidden}
.bar>i{position:relative;overflow:hidden}
.bar>i::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent 20%,rgba(255,255,255,.4),transparent 80%);
  transform:translateX(-120%);
  animation:barShine 4.6s ease-in-out infinite;
}
@keyframes barShine{
  0%,55%{transform:translateX(-120%)}
  85%,100%{transform:translateX(120%)}
}

/* 输入框：内阴影 + 聚焦光环 */
input[type=text],input[type=number],input[type=password],select,textarea{
  box-shadow:inset 0 2px 10px rgba(0,0,0,.35);
  transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
}
input[type=text]:hover,input[type=number]:hover,input[type=password]:hover,select:hover,textarea:hover{
  border-color:rgba(216,180,106,.42);
}
input[type=text]:focus,input[type=number]:focus,input[type=password]:focus,select:focus,textarea:focus{
  background:rgba(0,0,0,.45);
  box-shadow:inset 0 2px 10px rgba(0,0,0,.3), 0 0 0 3px rgba(216,180,106,.14), 0 0 22px rgba(216,180,106,.12);
}
input::placeholder,textarea::placeholder{color:rgba(139,152,168,.65);letter-spacing:.04em}

/* 物品格 / 地图卡：抬升与扫光 */
.slot,.map{transition:transform .2s cubic-bezier(.2,.7,.3,1), box-shadow .25s ease, border-color .2s ease}
.slot:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.35), 0 0 18px rgba(216,180,106,.14)}
.map{overflow:hidden}
.map::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.07) 48%,transparent 62%);
  transform:translateX(-110%);transition:transform .7s ease;
}
.map:hover::after{transform:translateX(110%)}
.map:hover{transform:translateY(-3px)}

/* 属性卡 */
.stat{transition:border-color .2s ease, background .2s ease}
.stat:hover{border-color:rgba(216,180,106,.28);background:rgba(216,180,106,.045)}

/* 头像呼吸光 */
.avatar{animation:avatarGlow 4.8s ease-in-out infinite}
@keyframes avatarGlow{
  0%,100%{box-shadow:0 0 18px rgba(120,180,220,.12), inset 0 0 18px rgba(0,0,0,.6)}
  50%{box-shadow:0 0 30px rgba(216,180,106,.26), inset 0 0 18px rgba(0,0,0,.55)}
}

/* 标题流光 */
.brand b{
  background:linear-gradient(100deg,#f7e9c8 0%,#fff7e2 18%,#c79f56 38%,#f7e9c8 58%,#fff7e2 78%,#c79f56 100%);
  background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:brandFlow 9s linear infinite;
}
@keyframes brandFlow{to{background-position:250% 0}}
.who .rl b{color:#8fe8c6;text-shadow:0 0 12px rgba(111,215,176,.45)}

/* 精英怪：边缘呼吸 */
.enemy-card.elite{animation:elitePulse 3.8s ease-in-out infinite}
@keyframes elitePulse{
  0%,100%{box-shadow:0 0 0 1px rgba(180,146,230,.16), 0 0 24px rgba(140,90,220,.1)}
  50%{box-shadow:0 0 0 1px rgba(180,146,230,.4), 0 0 34px rgba(140,90,220,.22)}
}
.enemy-card.elite.hit{animation:cardHit .38s ease}
.enemy-card.elite.crit{animation:cardCrit .46s ease}

/* 纪事：新行滑入 */
.log .l:last-child{animation:logIn .28s ease}
@keyframes logIn{from{opacity:0;transform:translateX(-5px)}to{opacity:1;transform:none}}

/* 弹窗入场 */
.modal-box{animation:modalIn .3s cubic-bezier(.2,.8,.25,1)}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}

/* 说明文字里的彩色强调不被 .hint b 压掉 */
.hint .gold{color:var(--gold2)!important}
.hint .jade{color:var(--jade)!important}
.hint .red{color:var(--red)!important}

/* 滚动条 */
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(216,180,106,.38),rgba(127,178,230,.28));border-radius:8px}

/* 标签微光 */
.tag{transition:border-color .2s ease, color .2s ease}
.tag:hover{border-color:var(--gold);color:var(--gold2)}

/* 顶栏：玻璃条 + 标题光 */
.hud{
  position:relative;padding:10px 6px 12px;margin-bottom:2px;
  border-bottom:1px solid rgba(216,180,106,.14);
  background:linear-gradient(180deg, rgba(10,16,24,.72), rgba(10,16,24,0));
  backdrop-filter:blur(8px);border-radius:0 0 16px 16px;
}
.brand .glyph{animation:glyphGlow 4s ease-in-out infinite}
@keyframes glyphGlow{
  0%,100%{filter:drop-shadow(0 0 8px rgba(216,180,106,.35))}
  50%{filter:drop-shadow(0 0 18px rgba(216,180,106,.75))}
}

/* 卡片四角记号 */
.card::before{
  content:"";position:absolute;inset:7px;border-radius:10px;pointer-events:none;opacity:.3;
  background:
    linear-gradient(var(--line2),var(--line2)) left top/14px 1px no-repeat,
    linear-gradient(var(--line2),var(--line2)) left top/1px 14px no-repeat,
    linear-gradient(var(--line2),var(--line2)) right top/14px 1px no-repeat,
    linear-gradient(var(--line2),var(--line2)) right top/1px 14px no-repeat,
    linear-gradient(var(--line2),var(--line2)) left bottom/14px 1px no-repeat,
    linear-gradient(var(--line2),var(--line2)) left bottom/1px 14px no-repeat,
    linear-gradient(var(--line2),var(--line2)) right bottom/14px 1px no-repeat,
    linear-gradient(var(--line2),var(--line2)) right bottom/1px 14px no-repeat;
  transition:opacity .3s ease;
}
.card:hover::before{opacity:.8}

/* 小标题前的金色菱形 */
.card h3{justify-content:flex-start;gap:9px}
.card h3 em{margin-left:auto}
.card h3::before{
  content:"";width:5px;height:5px;flex:0 0 auto;transform:rotate(45deg);
  background:var(--gold);box-shadow:0 0 8px rgba(216,180,106,.65);opacity:.8;
}
.create-card h3::before{display:none}
.create-card h3{justify-content:center}

/* 数值微光 */
.stat .sv{text-shadow:0 0 14px rgba(216,180,106,.22)}
.who .nm{text-shadow:0 0 18px rgba(216,180,106,.12)}

/* 激活标签更亮 */
.tab.on{box-shadow:0 0 24px rgba(216,180,106,.34), inset 0 1px 0 rgba(255,255,255,.35)}

/* 按钮悬浮再抬一点 */
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.35), 0 0 18px rgba(216,180,106,.12)}
.btn.primary:hover:not(:disabled){box-shadow:0 10px 30px rgba(216,180,106,.35), inset 0 1px 0 rgba(255,255,255,.5)}
.btn:active:not(:disabled){box-shadow:inset 0 3px 10px rgba(0,0,0,.45)}

/* 纪事栏顶边与行悬停 */
.loghead{border-bottom:1px solid rgba(216,180,106,.16)}
.log .l{border-radius:0 6px 6px 0;transition:background .18s ease}
.log .l:hover{background:rgba(255,255,255,.035)}

/* 地图卡描边微光 */
.map:hover{border-color:rgba(216,180,106,.4);box-shadow:0 14px 30px rgba(0,0,0,.45), 0 0 26px rgba(216,180,106,.12)}

/* 按钮点按水波 */
.btn .ripple{
  position:absolute;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle, rgba(255,255,255,.42), rgba(255,255,255,.08) 60%, transparent 70%);
  transform:scale(0);opacity:.9;
  animation:rippleOut .62s cubic-bezier(.2,.6,.3,1) forwards;
}
@keyframes rippleOut{to{transform:scale(1);opacity:0}}

/* 弹窗遮罩更深 */
.modal{background:rgba(3,6,10,.82)}

/* 细节收口 */
.status-row:empty{display:none}
.card{
  background-image:
    linear-gradient(180deg, rgba(216,180,106,.075), rgba(216,180,106,0) 52px),
    linear-gradient(180deg, rgba(18,27,38,.92), rgba(9,14,20,.94));
}
.side > .card:first-child{border-color:rgba(216,180,106,.3)}
.tabs{background:linear-gradient(180deg, rgba(14,21,30,.9), rgba(8,13,19,.65));box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.bar::after{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:rgba(255,255,255,.16);z-index:1;pointer-events:none}
.lograil{border-top:1px solid rgba(216,180,106,.25)}

@media (prefers-reduced-motion: reduce){
  body::after,.brand b,.brand .glyph,.avatar,.bar>i::after,.btn.primary,.enemy-card.elite,
  .tab.on::after,.log .l:last-child,.modal-box,.hud,.btn,.map::after{animation:none!important;transition:none!important}
  .map::after{display:none}
}

<body>
<div class="app">
  <header class="hud">
    <div class="brand"><span class="glyph">卍</span><b>帝尊世界</b><small>LOCAL EDITION · v1.3.0</small></div>
    <div class="hud-actions">
      <button class="btn tiny" data-act="go" data-arg="save">设置</button>
      <button class="btn tiny primary" data-act="saveGame">保存</button>
    </div>
  </header>
  <main class="layout">
    <aside class="side" id="side"></aside>
    <section class="main">
      <nav class="tabs" id="tabs"></nav>
      <div class="scroll">
        <div class="view"><div id="viewInner"></div></div>
      </div>
    </section>
    <aside class="lograil" id="lograil">
      <div class="loghead" data-act="toggleLog">
        <span class="lhtitle"><i class="live"></i>仙 途 纪 事</span>
        <span class="loglatest" id="logLatest"></span>
        <span class="lhact">
          <button class="btn tiny ghost" data-act="clearLog">清空</button>
          <span id="logToggle">收起</span>
        </span>
      </div>
      <div class="log" id="log"></div>
    </aside>
  </main>
</div>
<div id="modal" class="modal hidden"></div>
<div id="toast"></div>
<script>
/* =========================================================
   帝尊世界 · 本地单机版
   原型：WordBank「帝尊世界 v1.3.0」文本修仙 MUD
   ========================================================= */

/* ---------- 工具 ---------- */
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const chance = p => Math.random() < p;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function fmt(n){
  n = Math.floor(n);
  if (n < 10000) return String(n);
  if (n < 1e8) return (n / 1e4).toFixed(n < 1e6 ? 1 : 0).replace(/\.0$/, '') + '万';
  return (n / 1e8).toFixed(2).replace(/\.?0+$/, '') + '亿';
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const $ = s => document.querySelector(s);

/* ---------- 常量数据 ---------- */
const REALMS = [
  { n:'初入仙途', req:0,        atk:[0,0],         def:[0,0],         hp:[0,0],          trans:0,  fail:0,  loss:0 },
  { n:'略懂皮毛', req:2000,     atk:[50,300],      def:[10,100],      hp:[100,400],      trans:0,  fail:0,  loss:0 },
  { n:'小有所成', req:10000,    atk:[100,500],     def:[50,200],      hp:[300,700],      trans:0,  fail:0,  loss:0 },
  { n:'修仙者',   req:30000,    atk:[300,1000],    def:[100,300],     hp:[300,1200],     trans:1,  fail:8,  loss:2000 },

/* ---------- 存档 ---------- */
function save(){
  try{
    G.last = Date.now();
    localStorage.setItem(SAVE_KEY, JSON.stringify(G));
    return true;
  }catch(e){ toast('存档失败：' + e.message); return false; }
}
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const d = JSON.parse(raw);
    if(!d || typeof d !== 'object') return null;
    return Object.assign(fresh(), d);
  }catch(e){ return null; }
}
/* =========================================================
   派生属性 / 界面
   ========================================================= */
function stats(){
  const w = G.weapon ? WEAPONS[G.weapon] : null;
  const a = G.armor ? ARMORS[G.armor] : null;
  const c = G.acc ? ACCS[G.acc] : null;
  const p = G.pet ? PETS[G.pet] : null;
  const aw = AWAKEN[G.awaken] || AWAKEN[0];
  let atk = G.baseAtk + (w ? w.atk : 0) + (p ? p.atk : 0) + G.enhance * 35 + aw.atk + (c && c.atk ? c.atk : 0);
  let def = G.baseDef + (a ? a.def : 0);
  let maxHp = G.baseHp + (w && w.hp ? w.hp : 0) + (c && c.hp ? c.hp : 0) + aw.hp;
  if (G.artifact){
    atk *= 1 + (G.artifact.atkPct || 0);
    def *= 1 + (G.artifact.defPct || 0);
    maxHp *= 1 + (G.artifact.hpPct || 0);
  }
  if (G.demon > 0) atk *= 0.8;
  atk = Math.floor(atk); def = Math.floor(def); maxHp = Math.floor(maxHp);
  return { atk, def, maxHp, power: atk + maxHp };
}

function log(text, cls){
  const line = { t: new Date().toLocaleTimeString('zh-CN',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'}), m:text, c: cls || '' };
  G.log.push(line);
  if (G.log.length > 260) G.log.splice(0, G.log.length - 260);
  const box = $('#log');
  if (!box) return;
  const div = document.createElement('div');
  div.className = 'l ' + (cls || '');
  div.innerHTML = `<span class="t">${line.t}</span>${esc(text)}`;
  const em = box.querySelector('.empty');
  if (em) em.remove();
  box.appendChild(div);
  const lt = document.getElementById('logLatest');
  if (lt) lt.textContent = text;
  while (box.children.length > 160) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
}

function toast(msg, kind){
  const host = $('#toast');
  if (!host) return;
  const t = document.createElement('div');
  t.className = 'tst' + (kind ? ' ' + kind : '');
  if (kind === 'ok' || kind === 'err'){
    const ic = document.createElement('span');
    ic.className = 'tick';
    ic.textContent = kind === 'ok' ? '✓' : '!';
    t.appendChild(ic);
  }
  const span = document.createElement('span');
  span.textContent = msg;
  t.appendChild(span);
  host.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

/* ---------- 修行 ---------- */
function viewCultivate(){

      <div class="hint" style="line-height:2.1">

        ② 攒到 2000 修为后去「突破」，晋为略懂皮毛，攻击气血都会涨；<br>

    </div>` : ''}

      <div class="hint" style="margin-top:8px">${nx

function dayRow(title, desc, done, act){
  return `<div class="row">

    <button class="btn tiny ${done ? 'ghost' : 'jade'}" data-act="${act}" ${done ? 'disabled' : ''}>${done ? '明日再来' : '领取'}</button>

}

/* ---------- 突破 ---------- */
function viewRealm(){
  const nx = REALMS[G.realm + 1];
  const rows = REALMS.map((r, i) => {
    const cls = i < G.realm ? 'done' : i === G.realm ? 'now' : '';
    const rq = i === 0 ? '起点' : `${fmt(r.req)}修为` + (r.trans ? ` · ${r.trans}转` : '');
    return `<div class="rl ${cls}"><i class="ln"></i><span>${r.n}</span><span class="rq">${rq}</span></div>`;
  }).join('');
  const xpOk = nx && G.xiuwei >= nx.req;
  const trOk = nx && G.trans >= nx.trans;
  return `
    <div class="card">
      <h3>破 境 <em>${nx ? '下一境 · ' + nx.n : '已至绝巅'}</em></h3>
      ${nx ? `
        <div class="stats">
          <div class="stat"><div class="sl">所需修为</div><div class="sv">${fmt(nx.req)}</div></div>
          <div class="stat"><div class="sl">当前修为</div><div class="sv ${xpOk ? 'jade' : ''}">${fmt(G.xiuwei)}</div></div>
          <div class="stat"><div class="sl">成功率</div><div class="sv">${nx.fail ? Math.round(100 / nx.fail) + '%' : '100%'}</div></div>
          <div class="stat"><div class="sl">失败损失</div><div class="sv" style="font-size:14px;color:${nx.loss ? 'var(--red)' : 'inherit'}">${nx.loss ? fmt(nx.loss) : '无'}</div></div>
        </div>
        <div class="hint" style="margin-top:12px">

          ${nx.trans ? `需转生等级 <b class="${trOk ? 'jade' : 'red'}">${nx.trans}</b>（当前 ${G.trans} 转）` : '此境无转生门槛'}<br>

      <h3>境 界 阶 梯 <em>修为达标后可突破</em></h3>
      <div class="track">${rows}</div>
    </div>`;
}

/* ---------- 背包 ---------- */
function itemKind(n){
  if (WEAPONS[n]) return 'weapon';
  if (ARMORS[n]) return 'armor';
  if (ACCS[n]) return 'acc';
  return 'misc';
}
function itemStats(n){
  const k = itemKind(n);
  if (k === 'weapon') return { atk: WEAPONS[n].atk || 0, def: 0, hp: WEAPONS[n].hp || 0 };
  if (k === 'armor') return { atk: 0, def: ARMORS[n].def || 0, hp: 0 };
  if (k === 'acc') return { atk: ACCS[n].atk || 0, def: 0, hp: ACCS[n].hp || 0 };
  return { atk:0, def:0, hp:0 };
}
function equippedOf(k){ return k === 'weapon' ? G.weapon : k === 'armor' ? G.armor : k === 'acc' ? G.acc : null; }

function viewBag(){
  const filter = UI.bagFilter || 'all';
  const filters = [['all','全部'],['weapon','武器'],['armor','护甲'],['acc','饰品']];
  const slots = [];
  for (let i = 0; i < 15; i++){
    const n = G.bag[i];
    if (!n){ slots.push(`<div class="slot empty"><div class="sn">空</div><div class="ss">—</div></div>`); continue; }
    const k = itemKind(n);
    const st = itemStats(n);
    const meta = k === 'weapon' ? `攻 +${fmt(st.atk)}${st.hp ? ' · 血 +' + fmt(st.hp) : ''}`
      : k === 'armor' ? `防 +${fmt(st.def)}`
      : k === 'acc' ? (ACCS[n].passive || '饰品') : '物品';
    const off = filter !== 'all' && k !== filter;
    slots.push(`<button class="slot ${UI.sel === i ? 'on' : ''} ${off ? 'off' : ''}" data-act="selectSlot" data-arg="${i}">
      <div class="sn">${esc(n)}</div><div class="ss">${meta}</div></button>`);
  }
  const inv = Object.entries(G.inv).filter(([,v]) => v > 0);
  const mats = Object.entries(G.mats).filter(([,v]) => v > 0);
  const sel = UI.sel != null ? G.bag[UI.sel] : null;
  let detail = '';
  if (sel){
    const k = itemKind(sel);
    const st = itemStats(sel);
    const cur = equippedOf(k);
    const cs = cur ? itemStats(cur) : { atk:0, def:0, hp:0 };
    const line = (label, v, cv) => {
      if (!v) return '';
      const d = v - cv;
      const tag = d === 0
        ? '<span class="diff flat">（持平）</span>'
        : `<span class="diff ${d > 0 ? 'up' : 'down'}">（${d > 0 ? '+' : ''}${fmt(d)}）</span>`;
      return `<div class="kv"><span>${label}</span><b>${fmt(v)}${tag}</b></div>`;
    };
    const curLine = cur
      ? `当前装备：${esc(cur)}（${k === 'armor' ? '防御 ' + fmt(cs.def) : k === 'acc' ? '攻击 ' + fmt(cs.atk) + ' / 气血 ' + fmt(cs.hp) : '攻击 ' + fmt(cs.atk)}）`
      : '该部位空着';
    detail = `<div class="divider"></div>
      <div class="row" style="background:rgba(216,180,106,.05)">
        <div class="rt">
          <div class="rn">${esc(sel)} <span class="tag">${k === 'weapon' ? '武器' : k === 'armor' ? '护甲' : k === 'acc' ? '饰品' : '物品'}</span>
            ${SELL[sel] ? `<span class="tag dim">回收 ${fmt(SELL[sel])}</span>` : ''}</div>
          <div class="rd">${esc(descOf(sel))}</div>
        </div>
      </div>
      <div class="grid2" style="margin-top:10px">
        ${line('攻击', st.atk, cs.atk)}
        ${line('防御', st.def, cs.def)}
        ${line('气血', st.hp, cs.hp)}
      </div>
      <div class="hint" style="margin-top:6px">${curLine}${k === 'acc' && ACCS[sel].passive ? ` · 被动「${ACCS[sel].passive}」` : ''}</div>
      <div class="btn-row" style="margin-top:12px">
        ${k !== 'misc' ? `<button class="btn primary" data-act="equipSlot">装 备</button>` : `<button class="btn primary" data-act="useSlot">使 用</button>`}
        ${SELL[sel] ? `<button class="btn jade" data-act="recycleSlot">回 收</button>` : ''}
        <button class="btn ghost" data-act="dropSlot">丢 弃</button>
        <button class="btn ghost" data-act="deselect">取消</button>
      </div>`;
  } else {
    detail = `<div class="hint" style="margin-top:10px">点击格子查看物品与属性对比。</div>`;
  }
  return `
    <div class="card">
      <h3>储 物 背 包 <em>${G.bag.length} / 15</em></h3>
      <div class="bar xp sm"><i style="width:${G.bag.length / 15 * 100}%"></i></div>
      <div class="btn-row" style="margin-top:10px">
        ${filters.map(([k,n]) => `<button class="btn tiny ${filter === k ? 'primary' : 'ghost'}" data-act="bagFilter" data-arg="${k}">${n}</button>`).join('')}
      </div>
      <div class="slots" style="margin-top:10px">${slots.join('')}</div>
      ${detail}
      <div class="divider"></div>
      <div class="btn-row">
        <button class="btn tiny ghost" data-act="sortBag">整理背包</button>
        <button class="btn tiny jade" data-act="recycleAll">一键回收</button>
        <button class="btn tiny ghost" data-act="dropAll">全部丢弃</button>
      </div>
    </div>

    <div class="card">
      <h3>宠 物 背 包 <em>${G.pets.length} / 3</em></h3>

function equipRow(label, name, act){
  return `<div class="row">
    <div class="rt"><div class="rn">${label} · <b class="${name ? 'gold' : 'muted'}">${name ? esc(name) : '未装备'}</b></div>
    ${name ? `<div class="rd">${esc(descOf(name))}</div>` : ''}</div>
    ${name ? `<button class="btn tiny ghost" data-act="${act}">卸下</button>` : ''}
  </div>`;
}
function descOf(n){
  return (WEAPONS[n] && WEAPONS[n].desc) || (ARMORS[n] && ARMORS[n].desc) || (ACCS[n] && ACCS[n].desc) || (PETS[n] && PETS[n].desc) || '一件看不出用途的旧物。';
}

  return `

/* ---------- 江湖 ---------- */
function seedRand(x){
  const v = Math.sin(x * 12.9898) * 43758.5453;
  return v - Math.floor(v);
}
function sectLvInfo(){
  const lv = G.sect.level || 1;
  const cur = SECT_LEVELS[lv - 1] || SECT_LEVELS[0];
  const next = SECT_LEVELS[lv] || null;
  return { lv, cur, next };
}
function genMembers(ownerName, isOwner){
  const pool = NPC_NAMES.slice().sort(() => Math.random() - 0.5).slice(0, 7);
  const base = Math.max(600, stats().power);
  const arr = [{ n: ownerName, role: isOwner ? '门主' : '普通成员', me: true, p: base }];
  pool.forEach((n, i) => {
    arr.push({ n, role: i === 0 ? '长老' : i < 3 ? '精英成员' : '普通成员', me: false, p: Math.floor(base * (0.35 + Math.random() * 1.1)) });
  });
  return arr;
}
function genRank(){
  const day = dayKey();
  if (G.rank.day === day && G.rank.list && G.rank.list.length) return G.rank.list;
  const ep = Math.max(600, stats().power);
  const dayNum = Date.parse(day) / 86400000 || 1;
  const list = RANK_NAMES.map((n, i) => {
    const factor = 0.22 + seedRand(dayNum * 7.3 + i * 13.7) * 2.6;
    return { n, p: Math.floor(ep * factor), me: false };
  });
  list.push({ n: G.name || '你', p: ep, me: true });
  list.sort((a, b) => b.p - a.p);
  G.rank = { day, list };
  return list;
}

/* =========================================================
   游戏逻辑
   ========================================================= */
function dayKey(){ const d = new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; }
function ensureDay(){
  const k = dayKey();
  if (G.daily.d !== k){
    G.daily = { d:k, sign:false, gift:false, yb:false, ladder:false };
    G.ladder.tries = 10;
  }
}
function bagFree(){ return G.bag.length < 15; }
function addBag(name){
  if (!bagFree()){ log('背包已满，' + name + ' 未能拾取。', 'bad'); return false; }
  G.bag.push(name);
  return true;
}
function gainGold(n){ G.gold = Math.max(0, Math.floor(G.gold + n)); }
function gainXp(n){ G.xiuwei = Math.max(0, Math.floor(G.xiuwei + n)); G.totalXiuwei = Math.floor((G.totalXiuwei || 0) + Math.max(0, n)); }
function addItem(n, k){ G.inv[n] = Math.max(0, (G.inv[n] || 0) + k); }

/* ---------- 动作分发 ---------- */
const ACTS = {
  /* 通用 */
  go(btn, view){
    if (!G.created && view !== 'save' && view !== 'cultivate') { toast('请先创建角色'); return; }
    if (G.endless.on) stopEndless(true);
    if (BATTLE && !BATTLE.result) { log('战斗尚未结束，先打完或逃跑。', 'bad'); return; }
    BATTLE = null; G.auto = false;
    if (view === 'map') G.map = btn.dataset.map || 'gulin';
    G.view = view; UI.sel = null;
    render();
  },
  create(){
    const inp = $('#nameInput');
    let n = (inp ? inp.value : '').trim().replace(/[<>&"']/g, '');
    if (!n) {
      toast('道号不能为空');
      if (inp) { try { inp.focus(); } catch(e){} }
      return;
    }
    if (n.length > 8) n = n.slice(0, 8);
    G.name = n; G.created = true;
    G.view = 'cultivate';
    log(` welcome：${n} 踏入帝尊世界。`, 'gold');
    log('你可以先「打坐修炼」，也可以直接去「冒险」里砍幽魂。', 'sys');
    save(); render();
  },
  cultivate(){
    if (!G.created) { toast('请先创建角色'); return; }
    G.cultivating = !G.cultivating;
    log(G.cultivating ? '你盘膝坐下，灵气缓缓入体。' : '你收功起身，抖了抖衣袖。', 'sys');
    render();
  },
  breakthrough(){ doBreakthrough(); },
  guideDone(){ G.flags.guide = true; save(); render(); },
  tribulation(){
    if (G.flags.tribulation) return;
    if (G.xiuwei <= 5000000 || G.gold < 200000){ toast('条件不足'); return; }
    G.gold -= 200000;
    if (chance(0.25)){
      const a = rnd(10000, 50000), h = rnd(10000, 50000), d = rnd(1000, 50000);
      G.baseAtk += a; G.baseHp += h; G.baseDef += d;
      G.flags.tribulation = true;
      log(`九霄雷落，你硬生生扛了过去——渡劫成功！攻击 +${fmt(a)}，气血 +${fmt(h)}，防御 +${fmt(d)}。`, 'gold');
    } else {
      G.xiuwei = Math.max(0, G.xiuwei - 500000);
      G.demon = Math.max(G.demon || 0, 5);
      log('天雷贯顶，你被劈得神魂震荡，渡劫失败。金币 -20 万，修为 -50 万，道心受损。', 'bad');
    }
    save(); render();
  },
  heal(){
    if (BATTLE && !BATTLE.result){ toast('战斗中无法调息，先打完或逃跑'); return; }
    const s = stats();
    if (G.hp >= s.maxHp) { log('气血已满，无需调息。', 'sys'); return; }
    G.healing = 5; G.hp = Math.max(1, G.hp);
    log('你回到城中盘膝调息，气血正在恢复……', 'sys');
    render();
  },
  confirmYes(){
    const c = CONFIRM;
    CONFIRM = null;
    closeModal();
    if (c && c.run) c.run();
  },
  confirmNo(){ CONFIRM = null; closeModal(); },
  clearLog(){ G.log = []; lastLogStamp = ''; const b = $('#log'); if (b) b.innerHTML = ''; renderLogAll(); },
  toggleLog(){
    const el = $('#lograil');
    if (!el) return;
    el.classList.toggle('collapsed');
    const t = $('#logToggle');
    if (t) t.textContent = el.classList.contains('collapsed') ? '展开' : '收起';
  },

  /* 每日 */
  sign(){
    ensureDay();
    if (G.daily.sign) return;
    const g = rnd(200, 800), x = rnd(100, 800);
    G.daily.sign = true;
    gainGold(g); gainXp(x);
    log(`签到成功。金币 +${fmt(g)}，修为 +${fmt(x)}。`, 'gold');
    toast(`签到成功，金币 +${fmt(g)}`, 'ok');
    save(); render();
  },
  dailyGift(){
    ensureDay();
    if (G.daily.gift) return;
    const g = rnd(100, 1000), x = rnd(200, 2000), p = rnd(1, 6);
    G.daily.gift = true;
    gainGold(g); gainXp(x); addItem('还魂丹', p);
    log(`每日礼包：金币 +${fmt(g)}，修为 +${fmt(x)}，还魂丹 ×${p}。`, 'gold');
    toast('每日礼包已领取', 'ok');
    save(); render();
  },
  yuanbaoGift(){
    ensureDay();
    if (G.daily.yb) return;
    const y = rnd(1, 11);
    G.daily.yb = true; G.yuanbao += y;
    log(`元宝福利：元宝 +${y}。`, 'gold');
    toast(`元宝 +${y}`, 'ok');
    save(); render();
  },

  /* 背包 */
  selectSlot(btn, i){ UI.sel = Number(i); render(); },
  deselect(){ UI.sel = null; render(); },
  bagFilter(btn, f){ UI.bagFilter = f; render(); },
  sortBag(){
    const order = { weapon:0, armor:1, acc:2, misc:3 };
    G.bag.sort((a, b) => (order[itemKind(a)] - order[itemKind(b)]) || ((SELL[b] || 0) - (SELL[a] || 0)));
    UI.sel = null;
    log('你把背包里的东西按类别和价码码好了。', 'sys');
    save(); render();
  },
  recycleAll(){
    if (!G.bag.length){ toast('背包是空的'); return; }
    const total = G.bag.reduce((s, n) => s + (SELL[n] || 0), 0);
    if (!total){ toast('没有能回收的东西'); return; }
    openModal(`<h3>一 键 回 收</h3>

    G.rodDur = Math.max(0, G.rodDur - cost);

    else if (r === 10){ log(`钓了半天，什么也没有。耐久 -${Math.min(15, cost)}。`, 'sys'); }
    else if (r === 11){ log('啥也没发生……', 'sys'); }
    else {
      const fish = rnd(1, 10);
      G.mats['鱼'] = (G.mats['鱼'] || 0) + fish;
      log(`钓到 ${fish} 条鱼，耐久 -${cost}。`, 'good');

/* ---------- 突破 ---------- */
function doBreakthrough(){
  const nx = REALMS[G.realm + 1];
  if (!nx){ log('你已站在此界最高处。', 'sys'); return; }
  if (G.xiuwei < nx.req){ log(`修为不足，还需 ${fmt(nx.req - G.xiuwei)}。`, 'bad'); return; }
  if (G.trans < nx.trans){ log(`转生等级不足：${nx.n} 需要 ${nx.trans} 转。`, 'bad'); return; }
  const ok = nx.fail ? chance(1 / nx.fail) : true;
  if (!ok){
    G.xiuwei = Math.max(0, G.xiuwei - nx.loss);
    G.demon = Math.max(G.demon || 0, 5);
    log(`冲击${nx.n}失败，气机反噬，修为 -${fmt(nx.loss)}。`, 'bad');
    log('道心受损：接下来 5 场战斗攻击 -20%，可找道侣双修化解。', 'bad');
    save(); render(); return;
  }
  const a = rnd(nx.atk[0], nx.atk[1]);
  const d = rnd(nx.def[0], nx.def[1]);
  const h = rnd(nx.hp[0], nx.hp[1]);
  G.baseAtk += a; G.baseDef += d; G.baseHp += h;
  G.realm++;
  log(`突破成功！晋升「${nx.n}」：攻击 +${fmt(a)}，防御 +${fmt(d)}，气血上限 +${fmt(h)}。`, 'gold');
  toast(`突破成功：${nx.n}`, 'ok');
  log('气血上限已提升，回城调息可回满。', 'sys');
  save(); render();
}

/* ---------- 强化 / 觉醒 ---------- */
function doEnhance(times){
  let done = 0, up = 0, down = 0;
  for (let i = 0; i < times; i++){
    const stone = G.enhance >= 10;
    const gc = 500 + G.enhance * 30;
    const xc = 5000 + G.enhance * 400;
    if (G.gold < gc || G.xiuwei < xc) { log(`强化需要 ${fmt(gc)} 金币与 ${fmt(xc)} 修为。`, 'bad'); break; }
    if (stone && (G.inv['进阶石'] || 0) < 1) { log('强化 10 次以上，每次需要 1 颗进阶石。', 'bad'); break; }
    G.gold -= gc; G.xiuwei -= xc;
    if (stone) G.inv['进阶石']--;
    done++;
    if (chance(0.5)){
      G.enhance++; up++;
    } else if (G.enhance > 0 && chance(0.25)){
      G.enhance--; down++;
    }
  }
  if (!done) { render(); return; }
  log(`强化 ${done} 次：成功 +${up} 级${down ? `，失败降 ${down} 级` : ''}。当前强化 ${G.enhance} 级（伤害 +${fmt(G.enhance * 35)}）。`, up ? 'gold' : 'sys');
  toast(`强化 ${done} 次，+${up} 级`, up ? 'ok' : '');
  save(); render();
}
function doAwaken(){
  const next = AWAKEN[G.awaken + 1];
  if (!next){ toast('已至五觉'); return; }
  if (!G.weapon){ log('没有武器可供觉醒。', 'bad'); return; }
  if (G.enhance < 100){ log('武器累计强化不足 100 次。', 'bad'); return; }
  if (G.gold < 50000){ log('金币不足 5 万。', 'bad'); return; }
  if (G.xiuwei < next.req){ log(`修为不足 ${fmt(next.req)}。`, 'bad'); return; }
  if ((G.inv['觉醒石'] || 0) < 1){ log('没有觉醒石。', 'bad'); return; }
  G.gold -= 50000; G.inv['觉醒石']--;
  if (chance(0.25)){
    G.awaken++;
    log(`雷光绕刃——武器觉醒成功，晋为「${next.name}」！伤害 +${fmt(next.atk)}，气血 +${fmt(next.hp)}。`, 'gold');
    toast(`觉醒成功：${next.name}`, 'ok');
  } else {
    log('觉醒失败，觉醒石化作飞灰。', 'bad');
    toast('觉醒失败', 'err');
  }
  save(); render();
}

/* ---------- 抽奖 ---------- */
function drawWeapon(n){
  const coin = G.inv['抽奖币'] || 0;
  if (coin < n * 2){ toast('抽奖币不足'); return; }
  G.inv['抽奖币'] -= n * 2;
  const results = [];
  for (let i = 0; i < n; i++){
    const r = rnd(1, 100);
    if (r <= 2){ results.push(addBag('决') ? '★ 决' : '决（背包已满）'); }
    else if (r <= 6){ results.push(addBag('格尔仑塞') ? '格尔仑塞' : '格尔仑塞（背包已满）'); }
    else if (r <= 10){ results.push(addBag('阡陌') ? '阡陌' : '阡陌（背包已满）'); }
    else if (r <= 18){ addItem('抽奖币', 1); results.push('抽奖币 +1'); }
    else if (r <= 40){ addItem('生命药水', 1); results.push('生命药水'); }
    else if (r <= 52){ addItem('战争药水', 1); results.push('战争药水'); }
    else if (r <= 62){ addItem('膏药', 1); results.push('膏药'); }
    else if (r <= 70){ G.mats['重金属'] = (G.mats['重金属'] || 0) + 1; results.push('重金属'); }
    else results.push('空');
  }
  log(`武器抽奖 ${n} 次：${results.join('，')}。`, 'gold');
  toast(`武器抽奖完成，共 ${n} 次`, 'ok');
  save(); render();
}
function drawPet(n){
  const coin = G.inv['抽奖币'] || 0;
  if (coin < n){ toast('抽奖币不足'); return; }
  G.inv['抽奖币'] -= n;
  const results = [];
  for (let i = 0; i < n; i++){
    const r = rnd(1, 100);
    if (r <= 4){
      if (G.pets.length < 3){ G.pets.push('稚凤'); results.push('★ 稚凤'); }
      else results.push('稚凤（背包已满）');
    } else if (r <= 6){
      if (G.pets.length < 3){ G.pets.push('爪龙'); results.push('爪龙'); }
      else results.push('爪龙（背包已满）');
    } else if (r <= 14){ addItem('捕捉球', 3); results.push('捕捉球 ×3'); }
    else if (r <= 20){ addItem('抽奖币', 1); results.push('抽奖币 +1'); }
    else if (r <= 38){ addItem('生命药水', 1); results.push('生命药水'); }
    else if (r <= 55){ addItem('战争药水', 1); results.push('战争药水'); }
    else if (r <= 62){ addItem('膏药', 1); results.push('膏药'); }
    else results.push('空');
  }
  log(`宠物抽奖 ${n} 次：${results.join('，')}。`, 'gold');
  toast(`宠物抽奖完成，共 ${n} 次`, 'ok');
  save(); render();
}

/* ---------- 转生 ---------- */
function transNeed(){ return G.trans === 0 ? 10000 : G.trans * 20000; }
function doRebirth(oneKey){
  let count = 0, defGain = 0;
  for (let i = 0; i < 200; i++){
    const need = transNeed();
    if (G.transExp < need) break;
    G.transExp -= need;
    G.trans++;
    const d = G.trans * 10;
    G.baseDef += d; defGain += d;
    count++;
    if (!oneKey) break;
  }
  if (!count){ log('转生经验不足。', 'bad'); save(); render(); return; }
  log(`转生成功，如今 ${G.trans} 转，防御力 +${fmt(defGain)}。`, 'gold');
  toast(`转生成功：${G.trans} 转`, 'ok');
  save(); render();
}

   战斗引擎

function checkReady(){
  if (!G.created){ toast('请先创建角色'); return false; }
  if (G.hp <= 0){ log('气血已尽，先回城调息或服下还魂丹。', 'bad'); return false; }
  if (G.healing > 0){ G.healing = 0; }
  return true;
}
/* 境界越高，天地灵气越浓，修为收益越高 */
function xpMul(){ return 1 + G.realm * 0.3; }

function startBattle(cfg){
  BATTLE = Object.assign({
    round:1, hp:cfg.maxHp, result:null, rewardHtml:'', back:true, elite:false, lines:[],
    poisonTurns:0, slowTurns:0, enraged:false, fx:{}
  }, cfg);
  if (!BATTLE.lines) BATTLE.lines = [];
  G.auto = G.auto || false;
  G.view = 'map';
  render();
}

/* 一次完整的出手判定：
   回合开始（中毒/自愈） → 我方出手（闪避/暴击/被动） → 敌方出手（特性/连击/上毒）
   伤害先算浮动，再算减免，最后取整并保底 1 点。 */
function attackRound(){
  if (!BATTLE || BATTLE.result) return;
  const b = BATTLE;
  const s = stats();
  b.round++;
  if (!b.lines) b.lines = [];
  b.fx = {};
  const say = (m, c) => {
    b.lines.push({ m, c });
    while (b.lines.length > 9) b.lines.shift();
  };
  const variance = () => 0.92 + Math.random() * 0.16;

  /* ---- 回合开始 ---- */
  if (!G.god && b.poisonTurns > 0){
    const pd = Math.max(1, Math.floor(s.maxHp * 0.025));
    G.hp -= pd;
    b.poisonTurns--;
    say(`毒性发作，气血 -${fmt(pd)}。`, 'bad');
    b.fx.poisonTick = pd;
    if (G.hp <= 0){ G.hp = 0; loseBattle(); return; }
  }
  if (b.regen && b.hp > 0 && b.hp < b.maxHp){
    const heal = Math.max(1, Math.floor(b.maxHp * b.regen));
    b.hp = Math.min(b.maxHp, b.hp + heal);
    say(`${b.name}恢复 ${fmt(heal)} 点气血。`, 'sys');
    b.fx.enemyHeal = (b.fx.enemyHeal || 0) + heal;
  }
  const slowMul = b.slowTurns > 0 ? 0.85 : 1;
  if (b.slowTurns > 0) b.slowTurns--;
  if (G.pet === '稚凤' && chance(0.08)){
    G.hp += 300;
    b.fx.healPlayer = (b.fx.healPlayer || 0) + 300;
    say('稚凤振翅，替你回了 300 点气血。', 'good');
  }

  /* ---- 我方出手 ---- */
  if (b.dodge && chance(b.dodge)){
    say(`${b.name}身形一晃，避开了你的攻击。`, 'sys');
    b.fx.miss = true;
  } else {
    let dmg = s.atk * variance() * slowMul;
    if (b.defPct) dmg *= (1 - b.defPct / 100);
    if (b.def) dmg -= b.def;
    let crit = false;
    if (G.acc === '熔岩项链' && chance(0.25)){ dmg *= 1.8; crit = true; }
    if (G.acc === '洛神之泪' && G.hp < 600 && chance(0.4)){
      dmg += 100;
      const heal = Math.min(400, s.maxHp - G.hp);
      if (heal > 0){ G.hp += heal; b.fx.healPlayer = (b.fx.healPlayer || 0) + heal; }
      say('洛神之泪泛起微光，替你续了一口气。', 'good');
    }
    if (G.acc === '彼岸花戒' && b.hp < 500){
      dmg += s.atk + rnd(50, 120);
      say('彼岸花戒亮起，追加一记追击。', 'good');
    }
    if (G.pet === '爪龙' && chance(0.08)){
      const x = rnd(30, 150);
      dmg += x;
      say(`爪龙扑上去咬了一口，追加 ${x} 点伤害。`, 'good');
    }
    dmg = Math.max(1, Math.round(dmg));
    if (G.oneHit) dmg = Math.max(dmg, b.hp);
    b.hp -= dmg;
    b.fx.hit = true;
    b.fx.dmg = dmg;
    b.fx.crit = crit;
    say(crit ? `暴击！你对${b.name}造成 ${fmt(dmg)} 点伤害。` : `你对${b.name}造成 ${fmt(dmg)} 点伤害。`, crit ? 'gold' : 'good');
    if (b.hp > 0){
      if (!G.god && b.thorns){
        const t = Math.max(1, Math.floor(dmg * b.thorns));
        G.hp -= t;
        b.fx.hurtPlayer = (b.fx.hurtPlayer || 0) + t;
        say(`${b.name}护体反震，你受到 ${fmt(t)} 点反伤。`, 'bad');
      }
      if (b.lifesteal){
        const l = Math.min(Math.floor(dmg * b.lifesteal), b.maxHp - b.hp);
        if (l > 0){
          b.hp += l;
          b.fx.enemyHeal = (b.fx.enemyHeal || 0) + l;
          say(`${b.name}吸走 ${fmt(l)} 点气血。`, 'sys');
        }
      }
    }
  }
  if (b.kind === 'boss') G.bossHp = Math.max(0, b.hp);
  if (b.kind === 'boss2') G.boss2Hp = Math.max(0, b.hp);
  if (b.hp <= 0){ b.hp = 0; winBattle(); return; }
  if (G.hp <= 0){ G.hp = 0; loseBattle(); return; }

  /* ---- 敌方出手 ---- */
  if (!b.enraged && b.enrage && b.hp < b.maxHp * 0.35){
    b.enraged = true;
    b.fx.enrage = true;
    say(`${b.name}发出一声嘶吼，气势暴涨！`, 'bad');
    log(`${b.name}陷入狂暴。`, 'bad');
  }
  const rage = b.enraged ? 1.45 : 1;
  let md = rnd(b.dmg[0], b.dmg[1]) * variance() * rage;
  let mcrit = false;
  if (b.crit && chance(b.crit)){ md *= 1.8; mcrit = true; }
  /* 防御是固定减伤，但至少吃 15% 的伤害，避免后期防御把怪打成 1 点 */
  md = Math.max(1, Math.round(Math.max(md - s.def, md * 0.15)));
  if (G.god) md = 0;
  G.hp -= md;
  b.fx.hurtPlayer = (b.fx.hurtPlayer || 0) + md;
  b.fx.enemyHit = true;
  b.fx.enemyCrit = mcrit;
  say(`${b.name}对你造成 ${fmt(md)} 点伤害${mcrit ? '（暴击）' : ''}。`, 'bad');
  if (!G.god && b.poison && chance(b.poison)){
    if (b.poisonTurns <= 0) log(`${b.name}的毒渗进了经脉。`, 'bad');
    b.poisonTurns = 3;
    b.fx.poisoned = true;
    say('你中了毒，接下来三回合会持续掉血。', 'bad');
  }
  if (!G.god && b.slow && chance(b.slow)){
    b.slowTurns = 3;
    b.fx.slowed = true;
    say('寒气侵入经脉，你的攻击变弱了。', 'sys');
  }
  if (!G.god && b.double && chance(b.double) && G.hp > 0){
    const d2 = Math.max(1, Math.round(rnd(b.dmg[0], b.dmg[1]) * 0.55 * rage - s.def));
    G.hp -= d2;
    b.fx.hurtPlayer += d2;
    say(`${b.name}乘胜追击，再造成 ${fmt(d2)} 点伤害。`, 'bad');
  }
  if (G.hp <= 0){ G.hp = 0; loseBattle(); return; }
  updateBattleUI();
}

/* 只更新战斗面板的数值与特效，不重建整页，动画才不会被掐断 */
function battlePop(text, cls, host){
  const layer = host || document.getElementById('enemyFx');
  if (!layer) return;
  const el = document.createElement('span');
  el.className = 'dmg-pop' + (cls ? ' ' + cls : '');
  el.textContent = text;
  el.style.left = (44 + Math.random() * 12) + '%';
  layer.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}
function battleShake(el, cls){
  if (!el) return;
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), 520);
}
function updateBattleUI(){
  const b = BATTLE;
  if (!b || b.result) return;
  const s = stats();
  const card = document.getElementById('enemyCard');
  if (!card){ render(); return; }
  const eP = clamp(b.hp / b.maxHp * 100, 0, 100);
  const hP = clamp(G.hp / s.maxHp * 100, 0, 100);
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  const width = (id, v) => { const el = document.getElementById(id); if (el) el.style.width = v + '%'; };
  set('roundNum', '第 ' + b.round + ' 回合');
  set('eHpText', fmt(Math.max(0, b.hp)) + ' / ' + fmt(b.maxHp));
  set('pHpText', fmt(Math.max(0, G.hp)) + ' / ' + fmt(s.maxHp));
  width('eHpFill', eP);
  width('pHpFill', hP);

  const blog = document.getElementById('blog');
  if (blog){
    blog.innerHTML = b.lines.map(l => `<div class="${l.c || ''}">${esc(l.m)}</div>`).join('');
    blog.scrollTop = blog.scrollHeight;
  }
  const st = document.getElementById('statusRow');
  if (st){
    let tags = '';
    if (G.demon > 0) tags += `<span class="status demon">心魔 -20%</span>`;
    if (b.poisonTurns > 0) tags += `<span class="status poison">中毒 ${b.poisonTurns} 回合</span>`;
    if (b.slowTurns > 0) tags += `<span class="status slow">霜寒 ${b.slowTurns} 回合</span>`;
    st.innerHTML = tags;
  }
  const es = document.getElementById('enemyStatus');
  if (es) es.innerHTML = b.enraged ? '<span class="status rage">狂暴中</span>' : '';

  const fx = b.fx || {};
  if (fx.hit){
    battleShake(card, fx.crit ? 'crit' : 'hit');
    const layer = document.getElementById('enemyFx');
    if (layer){
      const sl = document.createElement('i');
      sl.className = 'slash';
      layer.appendChild(sl);
      setTimeout(() => sl.remove(), 520);
    }
    battlePop('-' + fmt(fx.dmg), fx.crit ? 'crit' : '');
  }
  if (fx.miss) battlePop('闪避', 'miss');
  if (fx.enemyHeal) battlePop('+' + fmt(fx.enemyHeal), 'heal');
  if (fx.hurtPlayer){
    battleShake(document.getElementById('playerStrip'), 'hurt');
    battlePop('-' + fmt(fx.hurtPlayer), '', document.getElementById('playerFx'));
  }
  if (fx.poisonTick) battlePop('毒 ' + fmt(fx.poisonTick), 'miss', document.getElementById('playerFx'));
  if (fx.healPlayer) battlePop('+' + fmt(fx.healPlayer), 'heal', document.getElementById('playerFx'));
  if (fx.enrage) battleShake(card, 'crit');
  /* 用完就清掉，否则每秒的 tick 会重放一次特效 */
  b.fx = {};
}

function winBattle(){
  const b = BATTLE;
  b.result = 'win';
  G.kills++;
  if (G.demon > 0){
    G.demon--;
    if (G.demon === 0) log('心魔散去，气机复归平顺。', 'good');
  }
  let html = '';
  const add = (label, val, cls) => { html += `<div class="kv" style="margin:4px 0"><span>${label}</span><b class="${cls || ''}">${val}</b></div>`; };

  switch (b.kind){
    case 'wild': {
      const x = Math.floor(rnd(100, 150) * xpMul()), g = rnd(70, 150);
      gainXp(x); gainGold(g);
      add('修为', '+' + fmt(x), 'gold'); add('金币', '+' + fmt(g), 'gold');
      if (chance(0.01) && G.pets.length < 3) { G.pets.push('稚凤'); add('灵宠', '稚凤', 'jade'); }
      if (chance(0.03) && (G.mats['魔晶'] || 0) < 99) { G.mats['魔晶'] = (G.mats['魔晶'] || 0) + 1; add('材料', '魔晶 ×1'); }
      break;
    }
    case 'tower': {
      const f = b.meta.floor;
      const x = Math.floor(rnd(300, 700) * f * xpMul()), g = rnd(200, 500) * f;
      gainXp(x); gainGold(g);
      add('修为', '+' + fmt(x), 'gold'); add('金币', '+' + fmt(g), 'gold');
      const drops = {
        1: [['棕熊爪', 0.9], ['膏药', 0.5], ['新手木剑', 0.25]],
        2: [['重金属', 0.9], ['尸剪', 0.3]],
        3: [['修罗斩刀', 0.18]],
        4: [['魔晶', 0.9], ['熔岩之心', 0.35]],
        5: [['冰霜铠甲', 0.25]],
      }[f] || [];
      drops.forEach(([n, p]) => {
        if (!chance(p)) return;
        if (n === '棕熊爪' || n === '重金属' || n === '魔晶' || n === '熔岩之心'){
          G.mats[n] = (G.mats[n] || 0) + 1; add('材料', n + ' ×1');
        } else if (addBag(n)) add('物品', n, 'gold');
      });
      if (G.towerFloor === f){ G.towerFloor = Math.min(5, f + 1); }
      if (f === 5 && G.towerFloor === 5) add('镇魂塔', '全塔已破！', 'jade');
      break;
    }
    case 'trial': {
      const x = Math.floor(rnd(400, 1200) * xpMul()), g = rnd(300, 900);
      gainXp(x); gainGold(g);
      add('修为', '+' + fmt(x), 'gold'); add('金币', '+' + fmt(g), 'gold');
      if (chance(0.15)){ const y = rnd(1, 5); G.yuanbao += y; add('元宝', '+' + y, 'gold'); }
      if (chance(0.0625)){ addItem('转生丹', 1); add('转生丹', '+1', 'jade'); }
      if (chance(0.0625)){ addItem('还魂丹', 1); add('还魂丹', '+1'); }
      if (chance(0.0625) && addBag('木质铠甲')) add('掉落', '木质铠甲', 'gold');
      break;
    }
    case 'dungeon': {
      const x = Math.floor(rnd(600, 800) * xpMul()), g = rnd(400, 750);
      gainXp(x); gainGold(g);
      add('修为', '+' + fmt(x), 'gold'); add('金币', '+' + fmt(g), 'gold');
      if (chance(0.3)) { G.mats['魔晶'] = (G.mats['魔晶'] || 0) + 1; add('材料', '魔晶 ×1'); }
      break;
    }
    case 'secret': {
      const big = b.name === '仙帝残影';
      const y = big ? rnd(40000, 90000) : rnd(12000, 30000);
      const c = big ? rnd(4, 8) : rnd(1, 3);
      gainGold(y);
      G.inv['秘境结晶'] = (G.inv['秘境结晶'] || 0) + c;
      add('金币', '+' + fmt(y), 'gold');
      add('秘境结晶', '+' + c, 'jade');
      if (big && chance(0.35)){
        G.inv['蓝图'] = (G.inv['蓝图'] || 0) + 1;
        add('蓝图', '+1', 'gold');
      }
      G.secretStep++;
      G.secretChoices = [];
      if (G.secretStep > 7) finalizeSecret();
      break;
    }
    case 'lava': {
      G.dungeonStep = 25;
      G.heat = 0;
      G.mats['熔岩之心'] = (G.mats['熔岩之心'] || 0) + 1;
      const g = rnd(20000, 40000), x = Math.floor(rnd(30000, 60000) * xpMul());
      gainGold(g); gainXp(x);
      add('熔岩之心', '+1', 'gold');
      add('金币', '+' + fmt(g), 'gold');
      add('修为', '+' + fmt(x), 'gold');
      if (chance(0.5)){
        G.mats['魔晶'] = (G.mats['魔晶'] || 0) + 3;
        add('魔晶', '+3');
      }
      break;
    }
    case 'boss': {
      const g = rnd(2750, 10000), x = Math.floor(rnd(3500, 18000) * xpMul());
      gainGold(g); gainXp(x);
      add('金币', '+' + fmt(g), 'gold'); add('修为', '+' + fmt(x), 'gold');
      if (chance(0.1) && addBag('屠龙宝刀')) add('传说', '屠龙宝刀', 'gold');
      G.bossHp = 0; G.bossAlive = false;
      break;
    }
    case 'boss2': {
      const g = rnd(100000, 500000), x = Math.floor(rnd(200000, 1000000) * xpMul());
      gainGold(g); gainXp(x);
      add('金币', '+' + fmt(g), 'gold'); add('修为', '+' + fmt(x), 'gold');
      if (chance(0.1) && addBag('麻痹戒指')) add('传说', '麻痹戒指', 'gold');
      G.boss2Hp = 0; G.boss2Alive = false;
      break;
    }
    case 'endless': {
      G.endless.wave++;
      b.rewardHtml = '';
      /* 立刻开下一波 */
      setTimeout(() => { if (G.endless.on) nextEndlessWave(); }, 260);
      BATTLE = null;
      save(); render();
      return;
    }
    case 'sect': {
      const lv = b.meta.lv;
      const x = Math.floor(rnd(6000, 14000) * lv * xpMul()), g = rnd(4000, 9000) * lv;
      gainXp(x); gainGold(g);
      add('修为', '+' + fmt(x), 'gold'); add('金币', '+' + fmt(g), 'gold');
      if (chance(0.3)){ addItem('转生丹', 1); add('转生丹', '+1', 'jade'); }
      if (chance(0.15) && addBag('木质铠甲')) add('掉落', '木质铠甲', 'gold');
      break;
    }
    case 'ladder': {
      const L = G.ladder;
      const gain = rnd(30, 60) + b.meta.diff * 20;
      const coin = rnd(5, 20) + b.meta.diff * 3;
      L.score += gain; L.coins += coin; L.wins++;
      add('段位积分', '+' + gain, 'jade'); add('天梯币', '+' + coin, 'gold');
      while (L.tier < 7 && L.score >= TIER_REQ[L.tier]){
        L.tier++; L.maxTier = Math.max(L.maxTier, L.tier);
        log(`段位晋升：${TIERS[L.tier]}！`, 'gold');
      }
      break;
    }
  }
  b.rewardHtml = html;
  log(`击败${b.name}。`, 'gold');
  save();
  if (G.auto && (b.kind === 'wild' || b.kind === 'tower' || b.kind === 'trial')){
    setTimeout(() => {
      if (!G.auto) return;
      if (G.hp < stats().maxHp * 0.25){ G.auto = false; log('气血过低，自动战斗停止。', 'bad'); render(); return; }
      BATTLE = null;
      if (b.kind === 'tower') fightTower(); else if (b.kind === 'trial') exploreTrial(); else exploreGulin();
    }, 420);
    return;
  }
  render();
}

function loseBattle(){
  const b = BATTLE;
  b.result = 'lose';
  G.auto = false;
  if (G.demon > 0){
    G.demon--;
    if (G.demon === 0) log('心魔散去，气机复归平顺。', 'good');
  }
  G.hp = 0;
  log(`你被${b.name}击倒，被路过的散修抬回了城中。`, 'bad');
  if (b.kind === 'sect') G.sect.dungeonDay = '';
  if (b.kind === 'endless'){
    const w = G.endless.wave, d = G.endless.diff;
    G.endless.on = false;
    const mult = 1 + d / 100;
    const gold = Math.floor(w * 900 * mult), xp = Math.floor(w * 700 * mult * xpMul());
    if (w > 0){ gainGold(gold); gainXp(xp); }
    G.endless.best = Math.max(G.endless.best || 0, w);
    b.rewardHtml = `<div class="kv"><span>撑过波数</span><b>${w}</b></div>
      <div class="kv"><span>金币</span><b class="gold">+${fmt(gold)}</b></div>
      <div class="kv"><span>修为</span><b class="gold">+${fmt(xp)}</b></div>`;
    log(`无尽试炼结束：撑过 ${w} 波，金币 +${fmt(gold)}，修为 +${fmt(xp)}。`, 'gold');
  }
  save(); render();
}

function againFight(){

function dungeonChoose(key){
  if (BATTLE && !BATTLE.result) return;

  if (G.dungeonStep >= 24){ log('已经到洞底了，先打熔岩之主。', 'sys'); return; }
  G.dungeonStep++;
  const st = G.dungeonStep;
  let heat = (G.heat || 0);
  let battle = null;
  const s = stats();

  if (key === 'push'){
    heat += 1;
    if (chance(0.55)){
      battle = mob({
        name: pick(['岩浆怪','炼狱蝰蛇','凋零']),
        maxHp: 1400 + st * 190, dmg:[200 + st * 38, 420 + st * 72], def: 150 + st * 14,

      });
    } else {
      const x = Math.floor(rnd(400, 900) * xpMul()), g = rnd(300, 800) + st * 120;
      gainXp(x); gainGold(g);
      log(`第 ${st} 步：岩缝里摸到金币 ${fmt(g)}、修为 ${fmt(x)}。`, 'good');
    }
  } else if (key === 'mine'){
    heat += 2;
    if (chance(0.3)){
      battle = mob({
        name:'岩浆怪', maxHp: 1600 + st * 200, dmg:[220 + st * 40, 450 + st * 75], def: 160 + st * 15,
        crit: 0.15, thorns: 0.2, kind:'dungeon',
        region:'熔岩洞穴 · 第 ' + st + ' 步', tip:'挖矿惊动了岩浆里的东西。'
      });
    } else if (chance(0.08)){
      G.mats['熔岩之心'] = (G.mats['熔岩之心'] || 0) + 1;
      log(`第 ${st} 步：凿开岩壳，居然挖出一颗熔岩之心！`, 'gold');
    } else {
      const c = rnd(1, 2);
      G.mats['魔晶'] = (G.mats['魔晶'] || 0) + c;
      log(`第 ${st} 步：采到魔晶 ×${c}。`, 'good');
    }
  } else {
    heat = Math.max(0, heat - 1);
    const heal = Math.floor(s.maxHp * 0.2);
    G.hp = Math.min(s.maxHp, G.hp + heal);
    log(`你在寒潭边坐下，气血 +${fmt(heal)}，热度退了一格。`, 'good');
  }

  G.heat = heat;
  if (G.heat >= 5){
    const d = Math.max(1, Math.floor(s.maxHp * 0.12));
    G.hp = Math.max(1, G.hp - d);
    G.heat = 3;
    log(`热浪扑上来，皮肉被灼伤，气血 -${fmt(d)}。`, 'bad');
  }
  if (battle){
    startBattle(battle);
  } else {
    save(); render();
  }
}

const SECRET_ROOMS = {
  spring:  { n:'灵泉', d:'泉眼冒着白气，喝一口能压住伤势。', risk:'安全' },
  bones:   { n:'古修遗骸', d:'前人坐化于此，储物袋还没被人翻过。', risk:'安全' },
  crystal: { n:'晶簇', d:'岩壁上结着一簇秘境结晶。', risk:'安全' },
  chest:   { n:'封禁石匣', d:'贴着符箓的石匣，隐约有宝光。', risk:'未知' },
  beast:   { n:'守境妖兽', d:'青灰色的妖兽挡在路中间。', risk:'战斗' },
  array:   { n:'残破杀阵', d:'阵纹还亮着，硬闯要挨几下。', risk:'危险' },
  merchant:{ n:'游方商人', d:'一个不知怎么混进来的商人，只收金币。', risk:'交易' },
  mirage:  { n:'迷雾', d:'雾里什么都看不清。', risk:'未知' },
  emperor: { n:'仙帝残影', d:'深处压下来的威压，绕不过去。', risk:'强敌' },
};

function ensureSecretChoices(){
  if (G.secretChoices && G.secretChoices.length) return G.secretChoices;
  const pool = ['spring','bones','crystal','chest','beast','array','merchant','mirage'];
  if (G.secretStep >= 5) pool.push('emperor');
  if (G.secretStep >= 6) pool.push('chest','emperor');
  const picks = [];
  let guard = 0;
  while (picks.length < 3 && guard++ < 200){
    const k = pool[Math.floor(Math.random() * pool.length)];
    if (!picks.includes(k)) picks.push(k);
  }
  G.secretChoices = picks;
  return picks;
}

function secretEnter(){
  if (BATTLE && !BATTLE.result) return;
  if (!checkReady()) return;
  if ((G.inv['传送卷轴'] || 0) <= 0){ log('没有传送卷轴了，先去秘境商店买。', 'bad'); return; }
  G.inv['传送卷轴']--;
  G.secretStep = 1;
  G.secretTrail = [];
  G.secretChoices = [];
  G.secretDone = false;
  ensureSecretChoices();
  log('你撕开传送卷轴，青光一闪，人已站在秘境里。', 'gold');
  save(); render();
}

function finalizeSecret(){
  const g = rnd(30000, 80000);
  const c = rnd(5, 10);
  gainGold(g);
  G.inv['秘境结晶'] = (G.inv['秘境结晶'] || 0) + c;
  let bp = false;
  if (chance(0.25)){ G.inv['蓝图'] = (G.inv['蓝图'] || 0) + 1; bp = true; }
  G.secretDone = true;
  log(`秘境探完：金币 +${fmt(g)}，结晶 +${c}${bp ? '，蓝图 +1' : ''}。`, 'gold');
}

function resolveSecretRoom(key){
  if (BATTLE && !BATTLE.result) return;
  if (!G.secretChoices || !G.secretChoices.includes(key)) return;
  const room = SECRET_ROOMS[key];
  if (!room) return;
  const step = G.secretStep;
  const s = stats();
  G.secretChoices = [];
  G.secretTrail.push(room.n);
  const finish = () => {
    G.secretStep++;
    if (G.secretStep > 7) finalizeSecret();
    save(); render();
  };
  switch (key){
    case 'spring': {
      const h = Math.floor(s.maxHp * 0.35);
      G.hp = Math.min(s.maxHp, G.hp + h);
      log(`灵泉下肚，气血 +${fmt(h)}。`, 'good');
      return finish();
    }
    case 'bones': {
      const g = rnd(4000, 9000) * step;
      gainGold(g);
      log(`你翻出前人的储物袋，得金币 ${fmt(g)}。`, 'gold');
      return finish();
    }
    case 'crystal': {
      const c = rnd(2, 4) + Math.floor(step / 2);
      G.inv['秘境结晶'] = (G.inv['秘境结晶'] || 0) + c;
      log(`敲下秘境结晶 ×${c}。`, 'gold');
      return finish();
    }
    case 'chest': {
      if (chance(0.18)){
        G.inv['蓝图'] = (G.inv['蓝图'] || 0) + 1;
        log('石匣里躺着一张蓝图！', 'gold');
      } else {
        const g = rnd(2, 6) * 10000;
        gainGold(g);
        log(`匣中无图，倒有一堆金币 ${fmt(g)}。`, 'gold');
      }
      return finish();
    }
    case 'array': {
      const d = Math.max(1, Math.floor(s.maxHp * 0.15));
      G.hp = Math.max(1, G.hp - d);
      const c = rnd(1, 3);
      G.inv['秘境结晶'] = (G.inv['秘境结晶'] || 0) + c;
      log(`杀阵割开皮肉，气血 -${fmt(d)}；阵眼里捡到结晶 ×${c}。`, 'bad');
      return finish();
    }
    case 'merchant': {
      if (G.gold >= 30000){
        G.gold -= 30000;
        G.inv['传送卷轴'] = (G.inv['传送卷轴'] || 0) + 1;
        G.inv['秘境结晶'] = (G.inv['秘境结晶'] || 0) + 2;
        log('你花 3 万金币换了 1 张卷轴和 2 颗结晶。', 'gold');
      } else {
        log('商人张口就要 3 万，你掏不出来。', 'sys');
      }
      return finish();
    }
    case 'mirage': {
      const r = rnd(1, 3);
      if (r === 1){
        G.inv['蓝图'] = (G.inv['蓝图'] || 0) + 1;
        log('雾里摸到一张蓝图。', 'gold');
      } else if (r === 2){
        const d = Math.max(1, Math.floor(s.maxHp * 0.1));
        G.hp = Math.max(1, G.hp - d);
        log(`雾里有什么咬了你一口，气血 -${fmt(d)}。`, 'bad');
      } else {
        log('雾散了，什么也没有。', 'sys');
      }
      return finish();
    }
    case 'beast': {
      startBattle(mob({
        name:'守境妖兽', maxHp: 6000 + step * 2500, dmg:[300 + step * 200, 800 + step * 300],
        def: 300 + step * 120, crit:0.15, kind:'secret', region:`秘境 · 第 ${step} 处`,
        tip:'守境妖兽守着这一处的机缘。'
      }));
      return;
    }
    case 'emperor': {
      startBattle(mob({
        name:'仙帝残影', maxHp:30000, dmg:[2500,7000], def:1800, defPct:20, crit:0.2, elite:true,
        kind:'secret', region:`秘境 · 第 ${step} 处`, tip:'残影也有仙帝的威压。'
      }));
      return;
    }
  }
  return finish();
}

/* ---------- 无尽 ---------- */
function startEndless(name, dr){
  if (!checkReady()) return;
  if ((G.inv['传送卷轴'] || 0) <= 0){ log('没有传送卷轴。', 'bad'); return; }
  if (G.endless.on){ log('已在无尽试炼中。', 'sys'); return; }
  G.inv['传送卷轴']--;
  G.endless = { on:true, diff:dr, wave:0, name };
  G.auto = true;
  log(`无尽试炼开始（${name}，免伤 ${dr}%）。`, 'gold');
  nextEndlessWave();
}
function nextEndlessWave(){
  if (!G.endless.on) return;
  const d = G.endless.diff, w = G.endless.wave;
  const hp = Math.floor(2600 * (1 + d / 40) * (1 + w * 0.45));
  const hi = Math.floor(300 * (1 + d / 30) * (1 + w * 0.4));
  startBattle(mob({
    name: `无尽魔物 · 第 ${w + 1} 波`, maxHp:hp, dmg:[Math.floor(hi * 0.6), hi],
    def: Math.floor(50 * (1 + d / 40) * (1 + w * 0.7)),
    defPct: Math.min(60, d), crit: w >= 3 ? 0.08 : 0, double: w >= 6 ? 0.2 : 0, enrage: w >= 8,
    poison: w >= 5 ? 0.15 : 0, kind:'endless', region:'无尽试炼 · ' + G.endless.name,
    tip:'自动战斗进行中，气血归零即结算。波数越高，特性越多。', back:true
  }));
  G.auto = true;
  render();
}
function stopEndless(manual){
  if (!G.endless.on) return;
  const w = G.endless.wave, d = G.endless.diff;
  G.endless.on = false; G.auto = false;
  const mult = 1 + d / 100;
  const gold = Math.floor(w * 900 * mult), xp = Math.floor(w * 700 * mult * xpMul());
  if (w > 0){ gainGold(gold); gainXp(xp); }
  G.endless.best = Math.max(G.endless.best || 0, w);
  BATTLE = null;
  log(`无尽试炼结束：撑过 ${w} 波，获得金币 ${fmt(gold)}、修为 ${fmt(xp)}。`, w > 0 ? 'gold' : 'bad');
  save(); render();
}

function render(){
  if (!G) return;
  const sig = G.view + '|' + (G.map || '') + '|' + (UI.shopTab || '') + '|' + (BATTLE ? BATTLE.name + BATTLE.hp : '');
  const keep = sig === lastSig && G.view !== 'battle';
  const saved = keep ? [...document.querySelectorAll('#viewInner input')].map(e => e.value) : [];
  renderSide();
  renderTabs();
  let html = '';
  if (!G.created && G.view !== 'save') html = viewCreate();
  else if (BATTLE) html = viewBattle();
  else html = (VIEWS[G.view] || VIEWS.cultivate)();
  $('#viewInner').innerHTML = html;
  if (keep){
    [...document.querySelectorAll('#viewInner input')].forEach((e, i) => {
      if (saved[i] !== undefined && saved[i] !== '') e.value = saved[i];
    });
  }
  renderLogAll();
  lastSig = sig;
}

/* ---------- 事件 ---------- */
function isTyping(){
  const a = document.activeElement;
  return !!a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA');
}
/* 按钮点按水波 */
document.addEventListener('pointerdown', e => {
  const btn = e.target && e.target.closest ? e.target.closest('.btn') : null;
  if (!btn || btn.disabled) return;
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height) * 1.25;
  const r = document.createElement('span');
  r.className = 'ripple';
  r.style.width = r.style.height = size + 'px';
  r.style.left = (e.clientX - rect.left - size / 2) + 'px';
  r.style.top = (e.clientY - rect.top - size / 2) + 'px';
  btn.appendChild(r);
  setTimeout(() => r.remove(), 650);
});

document.addEventListener('click', e => {
  if (e.target.id === 'modal'){ closeModal(); return; }
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  if (btn.disabled || btn.getAttribute('disabled') !== null) return;
  const fn = ACTS[btn.dataset.act];
  if (!fn) return;
  fn(btn, btn.dataset.arg);
});
/* 手机上弹出键盘时，把输入框滚到可见位置 */
document.addEventListener('focusin', e => {
  const t = e.target;
  if (!t || (t.tagName !== 'INPUT' && t.tagName !== 'TEXTAREA')) return;
  setTimeout(() => {
    try { t.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (_) {}
  }, 320);
});
let composing = false;
document.addEventListener('compositionstart', () => { composing = true; });
document.addEventListener('compositionend', () => { setTimeout(() => { composing = false; }, 40); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key !== 'Enter' || !e.target) return;
  /* 输入法选字时的回车不算提交 */
  if (composing || e.isComposing || e.keyCode === 229) return;
  if (e.target.id === 'nameInput'){
    e.preventDefault();
    ACTS.create();
  } else if (e.target.id === 'sectName'){
    e.preventDefault();
    ACTS.sectCreate();
  } else if (e.target.id === 'adminPass'){
    e.preventDefault();
    ACTS.adminCheck();
  } else if (e.target.id === 'transXpQty'){
    e.preventDefault();
    ACTS.convertXp();
  }
});

/* ---------- 启动 ---------- */
(function boot(){
  G = load() || fresh();
  const base = fresh();
  if (!G.map) G.map = 'gulin';
  G.inv = Object.assign({}, base.inv, G.inv || {});
  G.mats = Object.assign({}, base.mats, G.mats || {});
  if (!G.daily) G.daily = base.daily;
  if (!G.ladder) G.ladder = base.ladder;
  if (!G.endless) G.endless = base.endless;
  if (!G.sect) G.sect = base.sect;
  if (!G.partner) G.partner = base.partner;
  if (!G.rank) G.rank = base.rank;
  if (!G.sect.members) G.sect.members = [];
  if (!G.flags) G.flags = base.flags;
  if (!G.pets) G.pets = [];
  if (!G.log) G.log = [];
  if (!G.bag) G.bag = [];

  let offline = 0;
  const elapsed = Math.floor((Date.now() - (G.last || Date.now())) / 1000);
  if (G.created && G.cultivating && elapsed > 5){
    offline = Math.min(elapsed, 8 * 3600);
    G.xiuwei += offline;
    G.totalXiuwei = (G.totalXiuwei || 0) + offline;
  }
  ensureDay();
  G.last = Date.now();

  render();
  /* 小屏默认把纪事收成一条，点一下展开，免得挡住战斗 */
  if (window.matchMedia('(max-width:1240px)').matches){
    const lr = document.getElementById('lograil');
    if (lr) lr.classList.add('collapsed');
    const lt = document.getElementById('logToggle');
    if (lt) lt.textContent = '展开';
  }
  if (offline > 0){
    const h = Math.floor(offline / 3600), m = Math.floor(offline % 3600 / 60);
    log(`你离线的这段时间一直在打坐，${h ? h + ' 时 ' : ''}${m} 分，修为 +${fmt(offline)}。`, 'gold');
  } else if (!G.log.length){
    log('卍 帝尊世界 · 本地单机版 卍', 'big sys');
    log('原词库：帝尊世界 v1.3.0（作者 昊白）。此处为单机复刻。', 'sys');
  }

  setInterval(() => {
    if (!G) return;
    ensureDay();
    G.playTime = (G.playTime || 0) + 1;
    if (G.created && G.cultivating) gainXp(1);
    if (G.healing > 0){
      const s = stats();
      G.hp = Math.min(s.maxHp, G.hp + Math.ceil(s.maxHp / 5));
      G.healing--;
      if (G.healing === 0 || G.hp >= s.maxHp){
        G.healing = 0; G.hp = s.maxHp;
        log('调息完毕，气血已满。', 'good');
      }
    }
    if (isTyping()){ renderSide(); renderTabs(); }
    else if (BATTLE && !BATTLE.result){ renderSide(); renderTabs(); }
    else if (G.created && G.view === 'cultivate') render();
    else { renderSide(); renderTabs(); }
  }, 1000);

  setInterval(() => {
    if (G && G.auto && BATTLE && !BATTLE.result) attackRound();
  }, 600);

  setInterval(() => { if (G) save(); }, 15000);
  window.addEventListener('beforeunload', () => { if (G) save(); });
})();

function ladderFight(diff){
  if (!checkReady()) return;
  if (G.ladder.tries <= 0){ toast('今日次数已用完'); return; }
  G.ladder.tries--;
  const s = stats();
  const k = [0.55, 0.85, 1.15, 1.5][diff] || 1;
  const hp = Math.floor(s.maxHp * k);
  const atk = Math.floor(s.atk * k);
  const kits = [
    {},
    { dodge: 0.1 },
    { crit: 0.18, double: 0.15 },
    { crit: 0.2, double: 0.25, enrage: true },
  ];
  startBattle(mob(Object.assign({
    name: ['青锋客','白袍散人','玄衣剑修','无名剑尊'][diff],
    maxHp:hp, dmg:[Math.floor(atk * 0.18), Math.floor(atk * 0.34)],
    def: Math.floor(s.atk * [0.04, 0.07, 0.10, 0.14][diff]),
    kind:'ladder', region:'天梯 · ' + ['简单','普通','困难','噩梦'][diff],
    meta:{ diff }, elite: diff >= 2,
    tip:'人机对手强度与你相近，难度越高特性越多。'
  }, kits[diff] || {})));
}
